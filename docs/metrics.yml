# Реєстр метрик — машинний источник правди
#
# Чому окремий файл, а не docs/metrics_registry.md: реєстр писався ДО dbt і
# описує стан Looker (старі view, "план" замість реалізації, рішення, які
# відтоді змінились). Цей файл описує те, що дашборд показує НАСПРАВДІ, і
# саме він живить довідку по кліку на заголовок картки.
#
# Компілюється в web/data/metrics.json (scripts/build-metrics.mjs) — у репо
# дашборду їде тільки web/, тому в UI потрапляє скомпільований артефакт.
#
# Поля:
#   label        — як метрика підписана на дашборді (має збігатися дослівно)
#   definition   — що це, людською мовою, без формул
#   formula      — як рахується
#   grain        — грануляція джерела
#   source       — dbt-модель
#   owner        — власник методології (хто вирішує спірні питання)
#   status       — active | known_issue | needs_decision
#   note         — контекст, пастки, свідомі рішення. Показується завжди.

version: 1
updated: 2026-08-07

metrics:
  # ── Стр.1 Аудиторія ──────────────────────────────────────────────────
  - id: PROD-001
    label: Потенційні користувачі
    definition: >
      Уся база людей, які хоч раз прив'язувались до приміщення — незалежно
      від того, чи підтвердились і чи заходили в застосунок.
    formula: COUNT(DISTINCT user_phone_sk) серед не виключених користувачів
    grain: report_month × complex_id
    source: dbt_product.mart_user_base_totals_monthly
    owner: Артем
    status: active
    note: >
      Кожна людина рахується РІВНО ОДИН РАЗ, навіть якщо має приміщення в
      кількох ЖК (таких 1 660). Розріз по ЖК — за основним приміщенням
      (житло важливіше за комерцію/паркінг). Тому сума по ЖК дорівнює
      тоталу; у старому Looker вона була більшою за тотал на ~1 600.

  - id: PROD-002
    label: Підтверджені
    definition: >
      Верифіковані користувачі, які не деактивовані — ні індивідуально
      (роль), ні разом із будинком, який УК перестала обслуговувати.
    formula: COUNT(DISTINCT user_phone_sk) WHERE verified AND NOT excluded
    grain: report_month × complex_id
    source: dbt_product.mart_user_base_totals_monthly
    owner: Артем
    status: active
    note: >
      Деактивація БУДИНКУ і деактивація КОРИСТУВАЧА — незалежні механізми,
      УК свідомо не відв'язує жителів від квартир, щоб мати змогу їх
      повернути. Тому виключати треба обидва: тільки по ролі — пропустиш
      ~4,4 тис. людей з деактивованих домів, тільки по будинку — 579
      індивідуально деактивованих. Старий Looker не виключав ні тих, ні
      інших: список домів там був, але у WHERE не використовувався.

  - id: PROD-004
    label: "% підтверджених"
    definition: Частка підтверджених від усієї потенційної бази.
    formula: count_confirmed / count_potential
    grain: report_month × complex_id
    source: dbt_product.mart_user_base_totals_monthly
    owner: Артем
    status: active

  - id: PROD-005
    label: Відвідувачі додатку
    definition: >
      Унікальні люди з будь-якою подією в застосунку за місяць.
    formula: COUNT(DISTINCT user_phone_sk) по всіх подіях місяця
    grain: report_month × complex_id
    source: dbt_product.mart_user_base_totals_monthly
    owner: Артем
    status: active
    note: >
      Рахується по ТЕЛЕФОНУ, не по amplitude_id (рішення 2026-08-04).
      amplitude_id — це установка застосунку, а не людина: 20 064 пристрої
      на 13 919 телефонів, 29,6% людей мають більше одного. Стара метрика
      завищувала «Відвідувачів» на 22-25%, тому історичний ряд опустився —
      це виправлення, не падіння продукту.

  - id: PROD-006
    label: MAU з цільовою дією
    definition: >
      Люди, які за місяць зробили хоч одну ЦІЛЬОВУ дію — не просто зайшли
      подивитись, а довели дію до кінця.
    formula: COUNT(DISTINCT user_phone_sk) WHERE is_core_event
    grain: report_month × complex_id
    source: dbt_product.mart_user_base_totals_monthly
    owner: Артем
    status: active
    note: >
      Цільова дія = ТЕРМІНАЛЬНА подія ланцюжка (рішення Микити 2026-08-04):
      «натиснув Проголосувати», «оплата пройшла», «заявку створено» — а не
      «подивився» чи «відкрив». Список подій — у seed'і
      product_event_catalog, одному на весь домен; раніше він був
      продубльований у чотирьох місцях із розбіжностями (4/3/5/10 подій).

  - id: PROD-007
    label: Живі / Сонні / Неактивні
    definition: >
      Сегмент за давністю останнього входу відносно сьогодні.
    formula: >
      Живі — заходили менше місяця тому; Сонні — 1-3 міс; Неактивні —
      понад 3 міс
    grain: report_month × complex_id
    source: dbt_product.mart_user_segments_monthly
    owner: Артем
    status: active

  # ── Стр.2 Активація ──────────────────────────────────────────────────
  - id: PROD-008
    label: Конверсія в активацію
    definition: >
      Частка новачків, які зробили цільову дію вже в місяць першого входу.
    formula: count_activated / count_new_users
    grain: report_month (когорта новачків)
    source: dbt_product.mart_activation_monthly
    owner: Артем
    status: active
    note: >
      Категорій дві, не три: «активовані» + «не активувались» тотожно
      дорівнюють усім новачкам. Третьої категорії «без активності», яка
      була на старому дашборді, не існує — вона ніколи нічого не малювала.

  - id: PROD-014
    label: Швидкість до цінної дії
    definition: >
      Частка новачків, які дійшли до цільової дії за 1 годину / добу /
      тиждень від першого входу.
    formula: користувачі з цільовою дією у вікні / усі новачки когорти
    grain: report_month (когорта)
    source: dbt_product.mart_time_to_value
    owner: Артем
    status: active
    note: >
      Показуємо розподіл, а не медіану. Медіана тут не говорила ні про що:
      0,2 год при P90 313 год. Плюс у старому запиті був баг — три
      event_type написані підряд без ком, і BigQuery склеював їх в один
      неіснуючий; метрика рахувалась по 3 подіях замість 6.

  # ── Стр.3 Залученість ────────────────────────────────────────────────
  - id: PROD-015
    label: Середній денний актив
    definition: Скільки в середньому людей на день робили цільову дію.
    formula: AVG(унікальні користувачі з core-подією за день) по днях місяця
    grain: report_month
    source: dbt_product.mart_engagement_monthly
    owner: Артем
    status: active

  - id: PROD-010
    label: Медіанна сесія
    definition: Скільки триває типова сесія в застосунку.
    formula: медіана тривалості сесій місяця
    grain: session_id × user_phone_sk
    source: dbt_product.int_user_sessions
    owner: Артем
    status: active
    note: >
      Сесія = більше однієї події, тривалість від 0 до 4 годин. У Looker
      співіснували три різні визначення; без фільтрів середня сесія
      «тривала» 57,9 хв (застосунок висів у фоні), а медіана падала до
      5 секунд через 66 тис. одноподієвих сесій. Такі сесії — це переважно
      «застосунок прокинувся, показав PIN, далі не пішли».

  - id: PROD-016
    label: "Голосування: відкрили → проголосували"
    definition: >
      Скільки людей відкрили екран голосування і скільки з них дійшли до
      самого натискання «Проголосувати».
    formula: >
      відкрили — vote_details_active_scrn__view;
      проголосували — vote_details_active_btn_vote_tap
    grain: report_month
    source: dbt_product.mart_engagement_monthly
    owner: Артем
    status: active
    note: >
      «Відкрили» — саме зайшли на екран, а не «побачили десь у стрічці».
      Голосуванням вважаємо натискання кнопки, а не взаємодію з формою
      (vote_details_active_form__tap — 88,6 подій на юзера, це возня у
      формі). Через це раніше Стр.3 і Стр.4 показували 946 і 688 за той
      самий місяць; тепер узгоджені.

  - id: PROD-017
    label: Натиснули «Створити заявку»
    definition: >
      Скільки людей натиснули кнопку створення заявки в застосунку.
    formula: COUNT(DISTINCT user) WHERE event = request_new_desc_btn_create_tap
    grain: report_month
    source: dbt_product.mart_engagement_monthly
    owner: Артем
    status: known_issue
    note: >
      Це НАТИСКАННЯ КНОПКИ, а не підтверджено створена заявка і не рядок у
      CRM. Операційна метрика заявок (усі канали, з таблиці orders) —
      принципово інша й буде більшою. Порівнювати їх напряму не можна.

  - id: PROD-018
    label: Квитанції за комунальні послуги
    definition: >
      Оплати комуналки через застосунок: скільки пройшло, скільки банк
      відхилив, на яку суму.
    formula: >
      transaction_type='utilities', статуси accepted / rejected;
      незавершені спроби (new) не рахуються; сума в копійках / 100
    grain: report_month
    source: dbt_product.mart_utility_receipts_monthly
    owner: Аліона
    status: active
    note: >
      Джерело — банківські транзакції, а не подія застосунку: оплата йде
      через сторонній платіжний шлюз. ⚠️ Квитанції вивантажуються
      порціями протягом місяця, тому поточний місяць ЗАВЖДИ виглядає
      заниженим і дорослішає до кінця місяця — це не збій даних.

  - id: PROD-011
    label: Покриття модулів
    definition: Частка користувачів, які торкнулись модуля за місяць.
    formula: унікальні користувачі модуля / активна база місяця
    grain: report_month × module_code
    source: dbt_product.mart_module_usage_monthly
    owner: Артем
    status: active
    note: >
      Покриття подій — 100%. Раніше мапінг накривав лише 76%, і цілі
      модулі падали в «Інше» й зникали з таблиці: Сповіщення (третій за
      використанням модуль застосунку!), Віджети, Об'єкти, Тимчасові
      доступи.

  - id: PROD-019
    label: Відвал за модулями
    definition: >
      Частка тих, хто спробував модуль і більше до нього не повернувся у
      вікні спостереження.
    formula: користувачі без повторного використання / усі, хто спробував
    grain: module_code (знімок на сьогодні)
    source: dbt_product.mart_module_retention
    owner: Артем
    status: active
    note: Знімок на поточний момент, не помісячний ряд.

  # ── Стр.4 STAR ───────────────────────────────────────────────────────
  - id: PROD-009
    label: STAR
    definition: >
      North Star Metric — частка бази, яка виконує цільову дію.
    formula: унікальні користувачі з core-подією / база порівняння
    grain: report_month × star_category
    source: dbt_product.mart_star_monthly
    owner: Артем
    status: needs_decision
    note: >
      Показуємо ДВІ бази порівняння, бо в оригіналі вони суперечили одна
      одній: поле всередині STAR-запиту ділило на ПІДТВЕРДЖЕНИХ (≈21%), а
      цифра на дашборді (10,03%) рахувалась проти ПОТЕНЦІЙНИХ. Тобто поле
      з самого запиту на дашборді не використовувалось. Яка база
      канонічна — вирішує Артем.

  # ── Стр.5 Стан додатку ───────────────────────────────────────────────
  - id: PROD-020
    label: Примусові логаути
    definition: >
      Користувач побачив екран авторизації, хоча сам не виходив і це не
      нова реєстрація — тобто застосунок розлогінив його сам.
    formula: >
      бачив auth_number_scrn__view AND NOT (вихід/reauth/forgot)
      AND NOT нова реєстрація, поділено на тижневий актив
    grain: event_week × os_type × app_version
    source: dbt_product.mart_app_health_weekly
    owner: Артем
    status: active

  - id: PROD-021
    label: Технічний збій біометрії
    definition: >
      Поп-ап біометрії не з'явився, хоча користувач її раніше
      використовував, і він не натискав «пропустити».
    formula: >
      частка від «лояльних біометричних» користувачів (бачили поп-ап
      біометрії за останні 30 днів)
    grain: event_week × os_type × app_version
    source: dbt_product.mart_app_health_weekly
    owner: Артем
    status: active

  - id: PROD-022
    label: Fallback на PIN
    definition: >
      Поп-ап біометрії з'явився, користувач його не пропускав — і все одно
      ввів PIN.
    formula: частка від «лояльних біометричних» користувачів
    grain: event_week × os_type × app_version
    source: dbt_product.mart_app_health_weekly
    owner: Артем
    status: active

  # ── Додано 2026-08-07: метрики, яким бракувало довідки ───────────────
  - id: PROD-023
    label: Час у додатку за місяць
    definition: >
      Скільки часу типовий користувач провів у застосунку за весь місяць
      (сума його сесій, медіана по людях).
    formula: медіана від SUM(тривалість сесій) на користувача за місяць
    grain: report_month
    source: dbt_product.mart_engagement_monthly
    owner: Артем
    status: active
    note: >
      Рахується по тому ж канону сесії, що й «Медіанна сесія»: сесія — це
      більше однієї події тривалістю до 4 годин. Поточний місяць завжди
      нижчий за попередні, бо він ще не закінчився.

  - id: PROD-024
    label: Сесій за місяць
    definition: Скільки всього сесій відкрили користувачі за місяць.
    formula: COUNT(*) по сесіях місяця
    grain: report_month
    source: dbt_product.mart_engagement_monthly
    owner: Артем
    status: active
    note: >
      Без фільтра сесій було б на 69% більше (1,31 млн проти 778 тис.) —
      туди потрапляли одноподієві «застосунок прокинувся, показав PIN».

  - id: PROD-025
    label: Нові користувачі
    definition: Скільки людей уперше зайшли в застосунок за місяць.
    formula: COUNT(DISTINCT user_phone_sk) з першим входом у цьому місяці
    grain: report_month (когорта)
    source: dbt_product.mart_activation_monthly
    owner: Артем
    status: active
    note: >
      Абсолютне число поруч із конверсією не випадково: конверсія може
      зростати просто тому, що новачків стало менше.

  - id: PROD-026
    label: Активовані
    definition: >
      Новачки, які зробили цільову дію вже в місяць першого входу.
    formula: COUNT(DISTINCT user) з core-подією в місяць першого входу
    grain: report_month (когорта)
    source: dbt_product.mart_activation_monthly
    owner: Артем
    status: active

  - id: PROD-027
    label: Дійшли до цінності за добу
    definition: >
      Частка новачків, які зробили цільову дію протягом доби від першого
      входу.
    formula: користувачі з цільовою дією за 24 год / усі новачки когорти
    grain: report_month (когорта)
    source: dbt_product.mart_time_to_value
    owner: Артем
    status: active

  - id: PROD-028
    label: STAR від підтверджених
    definition: >
      Частка ПІДТВЕРДЖЕНОЇ бази, яка виконала цільову дію за місяць.
    formula: унікальні користувачі з core-подією / count_confirmed
    grain: report_month
    source: dbt_product.mart_star_monthly
    owner: Артем
    status: needs_decision
    note: >
      Це база, на яку ділило поле всередині оригінального STAR-запиту
      (лип.2026 давало ≈21%). На старому дашборді показувалась інша цифра —
      див. «STAR від потенційних». Яка канонічна — вирішує Артем.

  - id: PROD-029
    label: STAR від потенційних
    definition: >
      Частка ВСІЄЇ бази (включно з непідтвердженими), яка виконала цільову
      дію за місяць.
    formula: унікальні користувачі з core-подією / count_potential
    grain: report_month
    source: dbt_product.mart_star_monthly
    owner: Артем
    status: needs_decision
    note: >
      Саме так рахувалась цифра «STAR 10,03%» на старому дашборді — Looker
      ділив на рядок «Потенційних». Знаменник більший, тому відсоток
      завжди нижчий за «STAR від підтверджених».

  - id: PROD-030
    label: Користувачів із цільовою дією
    definition: >
      Скільки живих людей за місяць довели до кінця хоч одну цільову дію.
    formula: COUNT(DISTINCT user_phone_sk) WHERE is_core_event
    grain: report_month
    source: dbt_product.mart_star_monthly
    owner: Артем
    status: active
    note: >
      Це чисельник обох варіантів STAR — сама по собі цифра від вибору
      бази порівняння не залежить.

  - id: PROD-031
    label: Активних за тиждень
    definition: Скільки людей заходили в застосунок протягом тижня.
    formula: COUNT(DISTINCT user_phone_sk) з подією news_scrn__view за тиждень
    grain: event_week × os_type × app_version
    source: dbt_product.mart_app_health_weekly
    owner: Артем
    status: known_issue
    note: >
      ⚠️ Коли обрано «Усі версії», числа СУМУЮТЬСЯ по версіях — людина, що
      оновилась усередині тижня, порахується двічі. Для точного числа
      обери конкретну версію. Окремого distinct-агрегату поки немає.

  - id: PROD-032
    label: Операційна система
    definition: Розподіл активних користувачів місяця між iOS і Android.
    formula: COUNT(DISTINCT user_phone_sk) по last_os_type
    grain: report_month × os_type
    source: dbt_product.fct_user_monthly (агрегат agg_os_monthly)
    owner: Артем
    status: active
    note: >
      Рахується окремим distinct-запитом, а НЕ сумою по версіях: у розрізі
      місяць × ОС × версія той, хто за місяць був на двох версіях,
      рахувався двічі (iOS показувало 6 080 замість 5 153, +18%).
      Стара цифра в Looker (Android 1 630 / iOS 3 362) рахувалась лише по
      одній події — news_scrn__view.

  - id: PROD-033
    label: Версія застосунку
    definition: >
      Найпопулярніші збірки застосунку серед активних користувачів місяця —
      топ-5 і решта одним рядком.
    formula: COUNT(DISTINCT user) по app_version, топ-5 + «Інші версії»
    grain: report_month × os_type × app_version
    source: dbt_product.mart_version_adoption
    owner: Артем
    status: known_issue
    note: >
      ⚠️ Людина, яка за місяць оновилась, потрапляє в ОБИДВІ версії — тому
      сума по версіях більша за реальну кількість активних людей (той самий
      ефект, що ловили на розподілі по ОС: iOS 6 080 замість 5 153).
      Відсотки читати як «частка серед версій», не «частка людей».
      Раніше тут був поділ «Актуальна / Стара версія»: він ховав, ЯКА саме
      збірка стара, і зі зміною актуальної версії заднім числом переписував
      усю історію.

  # ── Додано 2026-08-11: закриття прогалин у довідці ───────────────────
  # 21 картка з 52 не мала запису в реєстрі — довідка мовчки не показувалась.
  # Тепер покриття перевіряє scripts/check-metric-coverage.mjs на збірці.

  - id: PROD-034
    label: Категорії цільових дій
    definition: >
      Розклад STAR по семи категоріях: яка частка бази виконала саме цю
      цільову дію за місяць.
    formula: унікальні користувачі категорії / база порівняння
    grain: report_month × star_category
    source: dbt_product.mart_star_monthly
    owner: Артем
    status: active
    note: >
      Сума по категоріях БІЛЬША за загальний STAR: одна людина може
      проголосувати і оплатити — вона потрапить у дві категорії, а в
      загальній цифрі порахується один раз. Категорія «Голосування» рахується
      по натисканню кнопки, а не по возні у формі — через це раніше Стр.3 і
      Стр.4 показували 946 і 688 за той самий місяць.

  - id: PROD-035
    label: Категорій у грі
    definition: >
      Скільки з семи категорій цільових дій мали хоч одного користувача за
      місяць.
    formula: COUNT(категорій WHERE unique_users > 0)
    grain: report_month
    source: dbt_product.mart_star_monthly
    owner: Артем
    status: active
    note: >
      Індикатор ширини продукту, а не обсягу: падіння з 7 до 5 означає, що
      два сценарії застосунку за місяць не використав НІХТО.

  - id: PROD-036
    label: Сума прийнятих
    definition: >
      Скільки грошей за комуналку реально пройшло через застосунок за місяць.
    formula: SUM(суми) по статусу accepted, копійки / 100
    grain: report_month
    source: dbt_product.mart_utility_receipts_monthly
    owner: Аліона
    status: active
    note: >
      Тільки успішні платежі — відхилені банком і незавершені спроби (new)
      сюди не входять. ⚠️ Поточний місяць завжди виглядає заниженим:
      квитанції вивантажуються порціями протягом місяця.

  - id: PROD-037
    label: Прийнято квитанцій
    definition: Скільки платежів за комуналку банк провів успішно за місяць.
    formula: COUNT(*) WHERE статус = accepted
    grain: report_month
    source: dbt_product.mart_utility_receipts_monthly
    owner: Аліона
    status: active

  - id: PROD-038
    label: Відхилено банком
    definition: >
      Скільки спроб оплати банк відхилив і яка це частка від усіх завершених
      спроб.
    formula: COUNT(*) WHERE статус = rejected; частка = rejected / (accepted + rejected)
    grain: report_month
    source: dbt_product.mart_utility_receipts_monthly
    owner: Аліона
    status: active
    note: >
      Це метрика платіжного шлюзу, а не застосунку: користувач зробив усе
      правильно, платіж не пройшов на стороні банку. Зростання частки —
      привід дивитись у бік шлюзу, а не продукту.

  - id: PROD-039
    label: Середній чек
    definition: Середня сума однієї успішної оплати комуналки за місяць.
    formula: сума прийнятих / кількість прийнятих
    grain: report_month
    source: dbt_product.mart_utility_receipts_monthly
    owner: Аліона
    status: active
    note: >
      Середня, не медіана — рахується в марті. Сезонність опалення видно
      саме тут, а не в кількості квитанцій.

  - id: PROD-040
    label: Сегменти за активністю
    definition: >
      Знімок бази на СЬОГОДНІ за давністю останнього входу: активні (< 1 міс),
      сплячі, втрачені.
    formula: розподіл користувачів по activity_segment
    grain: знімок на поточний момент
    source: dbt_product.mart_user_segments
    owner: Артем
    status: active
    note: >
      Не плутати з «Живі / Сонні / Неактивні» (PROD-007): там помісячний ряд
      з ковзним вікном, тут — один зріз на сьогодні. Числа НЕ мають
      збігатися.

  - id: PROD-041
    label: Житлові комплекси
    definition: >
      Та сама база користувачів у розрізі ЖК: потенційні, підтверджені,
      відвідувачі та MAU по кожному комплексу.
    formula: ті самі метрики PROD-001/002/004/005/006, згруповані по ЖК
    grain: report_month × complex_id
    source: dbt_product.mart_user_base_monthly
    owner: Артем
    status: active
    note: >
      Сума по ЖК ДОРІВНЮЄ загальній цифрі: людину з приміщеннями в кількох
      ЖК відносимо до одного основного (житло важливіше за комерцію та
      паркінг, далі — найстаріший будинок). У старому Looker такі 1 660
      людей рахувались у кожному своєму ЖК, і сума перевищувала тотал на
      ~1 600.

  - id: PROD-042
    label: Структура цільових дій по місяцях
    definition: >
      Частка кожної STAR-категорії серед УСІХ цільових дій місяця —
      стовпчик на 100%. Питання не «скільки людей дійшло до дії», а «на що
      саме вони її витрачають».
    formula: unique_users категорії / SUM(unique_users) усіх категорій місяця
    grain: report_month × star_category
    source: dbt_product.mart_star_monthly
    owner: Артем
    status: active
    note: >
      ANA-16, перенесено з Looker. НЕ плутати з «Категоріями цільових дій»
      (PROD-опис вище): там знаменник — база користувачів, тут — сума самих
      категорій, тому стовпчик завжди 100%. Одна людина може потрапити в
      кілька категорій, тож знаменник більший за «Всього активних», і ця
      частка не є часткою людей.

      Кольори — сім відтінків ОДНОГО кольору від темного до світлого
      (рішення Микити 2026-09-02, після двох спроб: шкала майже-сірого була
      незручна для аналізу, сім різних кольорів не вписувались у монохромний
      стиль дашборду). Історія й ціна вибору — в коментарі до токенів
      `--ramp-*` у globals.css.

      ⚠️ На шкалі одного тону сусідні кроки розрізняються слабше, ніж різні
      кольори, тому графік не покладається на колір сам по собі — легенда,
      підписи на сегментах, підказка з усіма категоріями, вигрузка.

      ⚠️ Колір закріплений за категорією через її позицію в наборі, тому
      сортувати серії за величиною не можна — кольори поїдуть місяць у
      місяць.

      Вікно — 13 місяців (хвіст вибраного періоду). Місяць, який ще триває,
      заштрихований: у перші дні частки стрибають (вер. 2026 на другий день
      показував СКД 77%).
