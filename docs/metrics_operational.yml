# Реєстр метрик ОПЕРАЦІЙНОГО дашборду — машинний источник правди
#
# Це САМОСТІЙНИЙ реєстр операційного дашборду. Він описує те, що показує
# застосунок `web-operational/`, і нічого більше. Він НЕ є продовженням
# `docs/metrics_registry.md`: там задокументовано аудит старого звіту Looker
# Studio (Фаза 1), і коди OPS-xxx у тому файлі означають зовсім інші метрики.
# Той файл — архів, до якого звертаються за історією; цей — джерело правди.
#
# Окремий файл від docs/metrics.yml (продуктовий) навмисно: кожен застосунок
# компілює свій реєстр і має власну перевірку покриття
# (scripts/check-metric-coverage.mjs падає, якщо на дашборді зʼявилась картка
# без запису). В одному спільному файлі перевірка кожного застосунку бачила б
# половину записів як «сирітські» і перестала б щось означати.
#
# Нумерація наскрізна, у порядку сторінок дашборду:
#   001-006  Огляд ЖК
#   007-016  Операційна ефективність (SLA)
#   017-026  Аналітика звернень: типи та категорії
#   027-036  Антирейтинг: скарги та навантаження
#   037-041  Ризик відтоку
#   042-046  Напруга і сегменти
#   047-059  Задоволеність мешканців (CSAT)
#
# Поля — ті самі, що в docs/metrics.yml:
#   label / definition / formula / grain / source / owner / status / note

version: 2
updated: 2026-08-19

metrics:
  # ── Огляд ЖК ─────────────────────────────────────────────────────────────
  - id: OPS-001
    label: Будинків
    definition: >
      Активні житлові будинки станом на кінець місяця, по всій компанії.
    formula: SUM(n_houses_active) по всіх ЖК
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview
    owner: Микита
    status: active
    note: >
      Point-in-time на deactivated_at КОНКРЕТНОГО місяця, не поточний статус
      — деактивований будинок перестає рахуватись з місяця деактивації, а не
      заднім числом і не назавжди «як був». Паркінгові будівлі без жодної
      квартири виключені (is_residential) — це і закрило розбіжність
      "будинків 132 vs 110" з аудиту Looker-дашборду.

  - id: OPS-002
    label: Квартир
    definition: >
      Квартири в активних житлових будинках, по всій компанії. Той самий
      point-in-time фільтр, що й «Будинків» — квартири вже деактивованого
      будинку (мешканці виїхали з-під УК) не рахуються в поточному інвентарі.
    formula: SUM(n_apartments) по всіх ЖК
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview
    owner: Микита
    status: active
    note: >
      На сторінці «Приміщення» поруч показані паркінг і комерція — окремими
      лініями, бо порядок величин відрізняється (квартир на порядок більше).

  - id: OPS-003
    label: Користувачів
    definition: >
      Уся база користувачів, привʼязаних до приміщення хоч раз, по всій
      компанії — незалежно від того, чи підтвердились і чи заходили в
      застосунок.
    formula: SUM(n_users_total) по всіх ЖК
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview (fct_users_monthly)
    owner: Микита
    status: active
    note: >
      Рахується з тієї самої моделі виключень (`int_user_exclusions`), що й
      PROD-001 на продуктовому дашборді — числа мають збігатися. Якщо
      розійшлися, шукати різницю в даті зрізу, а не в методології: джерело
      одне.

  - id: OPS-004
    label: Підтверджені
    definition: >
      Верифіковані користувачі, не деактивовані — ні як роль, ні через вихід
      будинку з-під управління.
    formula: SUM(n_users_confirmed) / SUM(n_users_total) по всіх ЖК
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview
    owner: Микита
    status: active
    note: >
      Аналог PROD-002 продуктового дашборду, тут — у розрізі ЖК замість
      єдиної цифри по компанії.

  - id: OPS-005
    label: Приміщення
    definition: >
      Квартири, паркомісця та комерційні приміщення в активних будинках,
      по всій компанії, у динаміці.
    formula: SUM(n_apartments), SUM(n_parking), SUM(n_commercial) по всіх ЖК
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview
    owner: Микита
    status: active

  - id: OPS-006
    label: Розріз по ЖК
    definition: >
      Ті самі метрики компанії (будинки, квартири, користувачі, частка
      підтверджених), розбиті по кожному ЖК за обраний місяць.
    formula: ті самі поля mart_monthly_complex_overview, без агрегації
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview
    owner: Микита
    status: active
    note: >
      ЖК без жодного будинку/квартири/користувача в місяці приховані з
      таблиці (QA-комплекси на кшталт "Форест"/БЦ "Арсенал" — уже виключені
      seed'ом test_complexes, лишаються нульові технічні записи). Севен може
      мати 0 будинків, але ненульових користувачів — паркінг-будинок
      лишається активним, коли житлові вже деактивовані; це не помилка.

  # ── Операційна ефективність (SLA) ────────────────────────────────────────
  - id: OPS-007
    label: Створено заявок
    definition: >
      Скільки заявок мешканці подали за місяць, по всій компанії. Рахуються
      всі подані, зокрема ті, які згодом скасували.
    formula: SUM(created_count) по всіх ЖК, місяць по created_at
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_sla
    owner: Микита
    status: active
    note: >
      Тестові ЖК виключені (seed test_complexes). Місяць фіксується датою
      подачі й більше не міняється — заявка, подана в грудні та закрита в
      січні, назавжди лишається грудневою.

  - id: OPS-008
    label: Виконано заявок
    definition: >
      Скільки заявок ЗАКРИЛИ як виконані за місяць. Місяць — це коли заявку
      закрили, а не коли подали.
    formula: SUM(completed_count) по всіх ЖК, місяць по closed_at
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_sla
    owner: Микита
    status: active
    note: >
      ⚠️ Ця цифра МОЖЕ перевищувати «Створено» за той самий місяць — і це не
      помилка: закривали те, що накопичилось раніше. Саме тому поруч живе
      «Закрито того ж місяця», який відповідає на інше питання.
      Дата закриття = completed_at, а де його немає — updated_at. Fallback
      потрібен через legacy-дані: у 2022-2023 completed_at порожній у 17-20%
      закритих заявок (поле зʼявилось лише з 2024, там пропусків 0,1%).
      Без fallback ряд за ті роки провалювався б на пʼятину. Історія
      переходів статусів тут не рятує — покриває 1 303 з 8 932 таких заявок.

  - id: OPS-009
    label: Закрито того ж місяця
    definition: >
      Яка частка поданих за місяць заявок була закрита в тому ж місяці —
      «скільки встигаємо по гарячому».
    formula: SUM(completed_same_month_count) / SUM(created_count)
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_sla
    owner: Микита
    status: active
    note: >
      За побудовою не перевищує 100%, на відміну від простого відношення
      «виконано / створено». Це головний показник швидкості на сторінці.

  - id: OPS-010
    label: Скасовано заявок
    definition: >
      Скільки заявок закрили зі статусом «скасовано»/«відхилено» за місяць,
      і яку частку від поданих це становить.
    formula: SUM(canceled_count); частка = canceled_count / created_count
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_sla
    owner: Микита
    status: active
    note: >
      Три написання статусу (canceled / cancelled / rejected) зведені в одне
      визначення `is_valid` у fact_orders — в аудиті Looker знайдено два
      різні набори статусів у різних запитах одного дашборду.

  - id: OPS-011
    label: Потік заявок
    definition: >
      Помісячна динаміка: скільки подали і скільки закрили. Дві лінії поруч
      показують, чи компанія встигає за вхідним потоком.
    formula: created_count і completed_count по місяцях
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_sla
    owner: Микита
    status: active

  - id: OPS-012
    label: Швидкість закриття
    definition: >
      Два показники разом: частка закритих того ж місяця і відношення
      «закрито за місяць / подано за місяць».
    formula: sla_rate_same_month і sla_rate по місяцях
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_sla
    owner: Микита
    status: active
    note: >
      Друга лінія навмисно може йти вище 100% — так видно місяці, коли
      розбирали накопичену чергу. Якщо потрібне одне число — брати перше.

  - id: OPS-013
    label: Незакритий залишок
    definition: >
      Скільки заявок лишалось відкритими на кінець кожного місяця,
      наростаючим підсумком від початку роботи.
    formula: >
      наростаюча сума (created_count − completed_count − canceled_count)
      по complex_id, впорядкована по місяцях
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_sla
    owner: Микита
    status: active
    note: >
      Рахується на повному спайні ЖК × місяць, а не лише на місяцях з
      активністю — інакше місяць без заявок випадав би з ряду і сходинка
      накопичення зникала. Перевірено: ряд ніде не йде в мінус.
      Це загальна черга; «прострочені 30+ днів» — окрема метрика (OPS-028).

  - id: OPS-014
    label: Статуси за весь час
    definition: >
      Розподіл усіх заявок з моменту запуску CRM за укрупненим статусом:
      виконано / скасовано / в роботі.
    formula: COUNT(*) по status, без розрізу місяця
    grain: complex_id × report_month × status
    source: dbt_operational.mart_status_donut
    owner: Микита
    status: active
    note: >
      ⚠️ Відхилення від старого дашборду: тут виключені тестові ЖК. У
      Looker цей блок не мав фільтра взагалі, тому сума буде трохи іншою.

  - id: OPS-015
    label: Заявки по роках
    definition: >
      Скільки заявок подали кожного календарного року і скільки з них
      виконали, скасували, лишили незакритими в межах того ж року.
    formula: >
      SUM(created_count) / SUM(completed_count) / SUM(canceled_count) по
      року created_at; in_progress = створено − виконано − скасовано
    grain: complex_id × report_year
    source: dbt_operational.mart_yearly_totals
    owner: Микита
    status: active
    note: >
      Рік фіксується датою ПОДАЧІ. У старому запиті рік брався по даті
      закриття, через що грудневі заявки переїжджали в наступний рік і
      «створено за рік» переставало бути кількістю створеного.
      ⚠️ in_progress тут — «не закрили того ж року», а не поточна черга:
      заявка з 2024, закрита у 2025, назавжди лишиться в in_progress 2024.
      Поточну чергу дає «Незакритий залишок» (OPS-013).

  - id: OPS-016
    label: Ефективність по ЖК
    definition: >
      Ті самі показники SLA за обраний місяць, розбиті по кожному ЖК:
      подано, закрито, частка закритих того ж місяця, черга.
    formula: поля mart_monthly_sla без агрегації по ЖК
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_sla
    owner: Микита
    status: active

  # ── Аналітика звернень: типи та категорії ────────────────────────────────
  - id: OPS-017
    label: Проблем
    definition: >
      Заявки з типом «Проблема» — щось зламалось або не працює. Найбільша
      робоча категорія після питань.
      ⚠️ Уся сторінка «Аналітика звернень» рахує ДІЙСНІ заявки, а сторінка
      SLA — усі подані. Це різні питання («яка робота прийшла» проти «який був
      вхідний потік»), і в марті вони лежать окремими полями
      (valid_created_count / created_count) саме тому, що в старому дашборді
      одне поле обслуговувало обидва — і розподіл по типах не сходився з
      лічильниками на тій самій сторінці.
    formula: SUM(problem_count) — тільки дійсні заявки (не скасовані)
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly
    owner: Микита
    status: active

  - id: OPS-018
    label: Питань і пропозицій
    definition: >
      Заявки з типом «Запитання» або «Пропозиція» — звернення, які не є
      несправністю.
    formula: SUM(question_count) + SUM(offer_count), тільки дійсні заявки
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly
    owner: Микита
    status: active
    note: >
      Питання — найчисленніший тип узагалі (76 634 з 164 201 за всю
      історію), тобто застосунок більшою мірою канал комунікації, ніж
      система заявок на ремонт.

  - id: OPS-019
    label: Скарг
    definition: >
      Заявки, яким диспетчер поставив тип «Скарга».
    formula: SUM(complaint_count), тільки дійсні заявки
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly
    owner: Артем
    status: known_issue
    note: >
      ⚠️ Поле практично не використовується: 990 скарг із 164 201 заявки за
      всю історію (0,6%), в окремих ЖК за пів року 0-8 штук. Тому всі
      похідні від нього показники старого «Антирейтингу скарг» —
      статистично порожні, і будувати на них рішення не можна.
      Реальне невдоволення сидить у ТЕКСТІ заявок типу «Проблема» і
      «Запитання»; його ловить окрема модель (сторінки «Ризик відтоку» і
      «Напруга і сегменти»), а не це поле. Тримаємо метрику на дашборді
      тільки для наступності зі старим звітом.

  - id: OPS-020
    label: Частка скарг
    definition: >
      Яка частка «гострих» звернень (проблеми + скарги) класифікована саме
      як скарга.
    formula: complaint_count / (problem_count + complaint_count)
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly
    owner: Артем
    status: known_issue
    note: >
      Успадковує проблему OPS-019 — знаменник великий, чисельник майже
      нульовий.

  - id: OPS-021
    label: Про що звертаються
    definition: >
      Розподіл заявок за категорією (опалення, електрика, ліфти та інші —
      15 видів) за обраний місяць.
    formula: SUM(created_count) по category_ua
    grain: complex_id × report_month × category_ua × type_ua
    source: dbt_operational.mart_monthly_categories
    owner: Микита
    status: active
    note: >
      Український словник категорій — seed `dim_order_category`, одна копія
      на весь проєкт. В аудиті Looker той самий словник було знайдено в
      трьох місцях із розбіжністю в перекладі «Домофон, відео, СКД».

  - id: OPS-022
    label: Динаміка категорій
    definition: >
      Як міняється структура звернень по місяцях — топ-категорії окремими
      рядами, решта згорнута в «Інше».
    formula: SUM(created_count) по category_ua × report_month
    grain: complex_id × report_month × category_ua × type_ua
    source: dbt_operational.mart_monthly_categories
    owner: Микита
    status: active

  - id: OPS-023
    label: Типи звернень
    definition: >
      Розподіл заявок за типом клієнта: Проблема / Запитання / Пропозиція /
      Послуга / Скарга / Не вказано.
    formula: SUM(created_count) по type_ua
    grain: complex_id × report_month × category_ua × type_ua
    source: dbt_operational.mart_monthly_categories
    owner: Микита
    status: active
    note: >
      Мітка «Не вказано» (13 346 заявок) підтверджена як канонічна, а не як
      дефект даних: частина заявок заводиться без типу свідомо.

  - id: OPS-024
    label: Відхилені заявки
    definition: >
      Скільки заявок скасували або відхилили, у розрізі ЖК, будинку та типу
      обʼєкта (квартира / паркінг / комерція / комора).
    formula: SUM(canceled_count) по house_id × property_kind_ua
    grain: house_id × property_kind_ua × category_ua × type_ua × report_month
    source: dbt_operational.mart_orders_house_monthly
    owner: Микита
    status: active

  - id: OPS-025
    label: Шукач аномалій
    definition: >
      Провал від категорії й типу звернення до конкретного будинку — щоб
      побачити, де саме дає сплеск те, що на рівні компанії виглядає нормою.
    formula: >
      created_count / completed_count / canceled_count на грануляції
      будинок × категорія × тип × місяць, вікно 12 місяців
    grain: house_id × property_kind_ua × category_ua × type_ua × report_month
    source: dbt_operational.mart_orders_house_monthly
    owner: Микита
    status: active
    note: >
      Глибше за будинок свідомо не йдемо. У Looker найглибшим рівнем було
      ПРИМІЩЕННЯ — це ~164 тис. комбінацій, які нікуди не вивантажити, і
      головне: рішення операційка приймає по будинку, а не по квартирі.
      Вікно 12 місяців — щоб порівняння з попереднім роком лишалось у даних.

  - id: OPS-026
    label: Особові рахунки
    definition: >
      Кількість особових рахунків білінгу в активних будинках ЖК.
    formula: COUNT(DISTINCT master_buh_id) по активних будинках місяця
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview
    owner: Микита
    status: active
    note: >
      Закриває стару розбіжність. У старому дашборді ця цифра рахувалась як
      «квартири з власником» (kind='apartment' AND owner_id IS NOT NULL), що
      суперечило задокументованому наміру («абонплата + комерція + паркінг +
      комори + квартири») і давало занижене число. Реальне джерело —
      master_buh_id у білінгу: поточний підрахунок дає 26 412 проти
      загадкових 26 777 зі старого звіту, різниця 1,4%.
      Тут — point-in-time, як і решта інвентарних метрик.

  # ── Антирейтинг: скарги та навантаження ──────────────────────────────────
  - id: OPS-027
    label: Навантаження на приміщення
    definition: >
      Скільки проблем і скарг за місяць припадає на 100 приміщень ЖК —
      показник, що дозволяє порівнювати ЖК різного розміру між собою.
      На дашборді множиться на 100: на одне приміщення це 0,029, і всі ЖК
      округлювались до нуля.
    formula: (problem_count + complaint_count) / n_spaces, показується × 100
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly
    owner: Микита
    status: active
    note: >
      Знаменник (у беклозі й старих запитах — «ор») це ПРИМІЩЕННЯ ЖК:
      квартири + паркінг + комерція + комори. Береться point-in-time, тобто
      рухається разом з портфелем.
      ⚠️ Відхилення від старого дашборду: у Looker знаменник рахувався
      статичним CROSS JOIN по поточному стану, тому ЖК, який уже пішов з-під
      управління, лишався в знаменнику назавжди. Рядок «Середній показник»
      там же рахувався взагалі без виключень і був зміщений тестовими та
      покинутими обʼєктами.

  - id: OPS-028
    label: Прострочено 30+ днів
    definition: >
      Скільки заявок на кінець місяця були відкриті 30 днів і довше —
      стан черги, а не потік.
    formula: >
      COUNT(*) WHERE заявка створена <= кінець місяця − 30 днів
      AND (не закрита, або закрита пізніше кінця місяця)
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly
    owner: Микита
    status: active
    note: >
      Поріг саме 30 днів (не 29) підтверджений Микитою — у старому запиті
      поруч лежали обидва варіанти, і який із них потрапляв на дашборд,
      з коду було не видно.

  - id: OPS-029
    label: Задач на проблему
    definition: >
      Скільки внутрішніх задач породжує одна заявка типу «Проблема» або
      «Скарга». Задумувалось як міра трудомісткості звернення.
    formula: >
      problem_complaint_tasks / (problem_count + complaint_count)
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly
    owner: Микита
    status: known_issue
    note: >
      ⚠️ Показник виявився КОНСТАНТОЮ і трудомісткості не міряє. По роках:
      2022 — 1,01 · 2023 — 0,98 · 2024 — 0,96 · 2025 — 0,99 · 2026 — 1,01,
      розкид між ЖК 0,66-1,17. Причина проста: CRM заводить рівно одну задачу
      на заявку, тож відношення приречене бути одиницею незалежно від того,
      скільки роботи насправді зробили.
      Тому з картки на сторінці його прибрано (там тепер «Робота без заявок»,
      OPS-036), а сам показник лишився приміткою поруч — щоб наступного разу
      не «відкривати» його заново. Реальну трудомісткість треба брати з часу
      закриття або з кількості виконавців, а не звідси.

  - id: OPS-030
    label: Внутрішніх задач
    definition: >
      Задачі співробітників, не привʼязані до жодної заявки мешканця —
      планова робота, обходи, профілактика.
    formula: COUNT(*) WHERE order_id IS NULL, по місяцю created_at
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly (fact_order_tasks)
    owner: Микита
    status: active
    note: >
      Метрика зʼявилась тільки 2026-08-19: до того гео задачі бралось
      виключно через заявку, а в задачі співробітника заявки за визначенням
      немає — тому всі 55,7 тис. таких задач лишались без ЖК і порахувати їх
      у розрізі було нічим. Джерело гео — `tasks_locations`, воно весь час
      було в BigQuery, просто не підключене.

  - id: OPS-031
    label: Навантаження по ЖК
    definition: >
      Порівняння ЖК між собою за навантаженням на приміщення, з лінією
      середнього по компанії.
    formula: load_rate по ЖК + середнє = SUM(проблем+скарг) / SUM(приміщень)
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly
    owner: Микита
    status: active
    note: >
      Середнє рахується як відношення сум, а не як середнє відношень — щоб
      маленький ЖК з двома заявками не важив стільки ж, скільки великий.

  - id: OPS-032
    label: Скарги окремо
    definition: >
      Скарги на одне приміщення ЖК — той самий розріз, що й навантаження,
      але без проблем.
    formula: complaint_count / n_spaces
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly
    owner: Артем
    status: known_issue
    note: >
      Успадковує проблему OPS-019 — тип «Скарга» майже не проставляється.

  - id: OPS-033
    label: Антирейтинг будинків
    definition: >
      Рейтинг будинків за кількістю заявок на 100 квартир — «індекс
      проблемності» зі старого дашборду. На квартиру всі 15 рядків топу
      округлювались до 0,2 / 0,1 і рейтинг переставав бути рейтингом.
    formula: SUM(valid_created) по будинку / n_apartments, показується × 100
    grain: house_id × property_kind_ua × category_ua × type_ua × report_month
    source: dbt_operational.mart_orders_house_monthly
    owner: Микита
    status: active
    note: >
      ⚠️ Відхилення від старого дашборду: виключення будинків тут єдине й
      похідне від даних (deactivated_at + seed тестових ЖК). У Looker на цій
      таблиці працював окремий, четвертий за рахунком механізм — звірка за
      НАЗВОЮ ЖК і НОМЕРОМ будинку рядками, який доводилось правити руками
      при кожній деактивації.

  - id: OPS-034
    label: Антирейтинг ЖК
    definition: >
      Той самий індекс проблемності, агрегований на рівень ЖК — заявок на
      100 квартир.
    formula: SUM(valid_created) по ЖК / SUM(n_apartments) по ЖК, × 100
    grain: house_id × property_kind_ua × category_ua × type_ua × report_month
    source: dbt_operational.mart_orders_house_monthly
    owner: Микита
    status: active

  - id: OPS-035
    label: Черга 30+ у динаміці
    definition: >
      Як міняється кількість заявок, що висять понад 30 днів, від місяця до
      місяця, по компанії та в розрізі ЖК.
    formula: SUM(backlog_30d) по місяцях
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly
    owner: Микита
    status: active

  - id: OPS-036
    label: Робота без заявок
    definition: >
      Співвідношення внутрішніх задач до всіх задач — скільки роботи
      компанія робить за власною ініціативою, а не за зверненням мешканця.
    formula: employee_task_count / total_tasks
    grain: complex_id × report_month
    source: dbt_operational.mart_complex_load_monthly
    owner: Микита
    status: active

  # ── Ризик відтоку ────────────────────────────────────────────────────────
  - id: OPS-037
    label: Будинків у зоні уваги
    definition: >
      Скільки житлових будинків станом на місяць мають ознаки руху до виходу
      з-під управління — або конфліктну траєкторію (стадія 2 і вище), або
      мовчазне згасання активності.
    formula: COUNT(*) WHERE needs_attention = стадія >= 2 OR is_fading
    grain: house_id × report_month
    source: dbt_operational.mart_house_churn_risk_monthly
    owner: Артем
    status: needs_decision
    note: >
      Це ПРІОРИТИЗАТОР черги роботи, а не оцінка ймовірності. Подій виходу
      за три роки лише 13 — навчати на них модель нема на чому, тому пороги
      підібрані по перцентилях розподілу (p80-p90) і задокументовані прямо
      в моделі. Перевірка на історії: прапорець піднявся в 11 із 13
      будинків, що реально пішли. Не спрацював на «Варшавський» 20-А і
      Севен 20-Б — обидва пішли, майже не лишивши слідів у застосунку.

  - id: OPS-038
    label: Організація і вище
    definition: >
      Будинки на стадіях 3-5: є координована група мешканців, заявлений
      намір вийти або вже зафіксований вихід.
    formula: COUNT(*) WHERE risk_stage >= 3
    grain: house_id × report_month
    source: dbt_operational.mart_house_churn_risk_monthly
    owner: Артем
    status: active
    note: >
      Сходинки: 0 норма, 1 роздратування (оцінки 1-2 понад 60%),
      2 юридизація (вимоги документів і посилання на договір),
      3 організація (ескалаційна кампанія), 4 намір (пряма згадка ОСББ або
      зміни УК), 5 пішли. Беремо НАЙВИЩУ, що спрацювала. Порядок 2 < 3
      навмисний: юридична лексика зустрічається набагато частіше за
      кампанії.

  - id: OPS-039
    label: Будинків у згасанні
    definition: >
      Будинки, де активність у застосунку впала нижче половини власної бази
      і тримається так три місяці поспіль.
    formula: >
      заявок за 3 міс / міс < 0.5 × (заявок за міс M-12..M-4 / 9),
      три місяці поспіль
    grain: house_id × report_month
    source: dbt_operational.mart_house_churn_risk_monthly
    owner: Артем
    status: active
    note: >
      Окремий прапорець, а НЕ сходинка: будинок може згасати без жодного
      конфлікту (ЖК «Севен» — саме цей сценарій), і навпаки. Складати два
      режими в одну шкалу не можна. Пастка, через яку прапорець і зʼявився:
      база рахується по власних місяцях будинку, тож при повільному
      згасанні вона сповзає слідом за падінням і поріг обвалу не
      пробивається ніколи — Севен 18-А впав із ~60 заявок на місяць до ~25
      за рік, і жодна сходинка не спрацювала.

  - id: OPS-040
    label: Частка оцінок 1–2
    definition: >
      Яка частка оцінок, поставлених мешканцями при ЗАКРИТТІ заявки, — це
      1 або 2 бали. Ковзні три місяці по всьому портфелю.
    formula: SUM(оцінок 1-2 за 3 міс) / SUM(усіх оцінок за 3 міс)
    grain: house_id × report_month
    source: dbt_operational.mart_house_churn_risk_monthly (order_reviews)
    owner: Артем
    status: active
    note: >
      Найсильніший чистий корелят токсичності: при контролі обсягу звернень
      звʼязок із часткою негативу 0.35 проти 0.36 у кількості аварій. Тобто
      токсичність породжують не поломки, а погано закриті заявки.
      ⚠️ CSAT-опитування сюди НЕ входять: 3 750 із 3 794 відповідей не мають
      house_id, бо голосування створюється одне на весь ЖК. Поки технічна
      команда не збереже обрану адресу при голосуванні, єдине джерело
      оцінок з привʼязкою до будинку — оцінки закриття заявок.

  - id: OPS-041
    label: Ескалаційні кампанії
    definition: >
      Випадки, коли троє й більше різних мешканців одного ЖК подали заявки
      майже однаковим текстом протягом двох тижнів, і в тексті є юридична
      вимога, звернення від імені групи або згадка ОСББ.
    formula: >
      >= 3 різних citizen_id І >= 3 різних created_by_id на однаковий
      префікс тексту (45 символів), розрив між заявками <= 14 днів
    grain: campaign_id
    source: dbt_operational.mart_campaigns
    owner: Артем
    status: known_issue
    note: >
      Умова «>= 3 різних АВТОРИ записи» не дублює першу і критична: без неї
      детектор забивається диспетчерськими шаблонами, де citizen_id різні,
      а пише їх один оператор.
      ⚠️ Детектор ловить СИНХРОННІСТЬ, а не тиск: зі 121 знайденої кампанії
      ескалаційних лише 19, решта — побутові збіги («Перезапустіть
      котельню, потухла» від пʼятьох за годину). У стадію рахуються тільки
      ескалаційні; побутові лишились окремою колонкою, бо операційно вони
      корисні (одна аварія = пʼять заявок).
      ⚠️ Словник маркерів — v1, зібраний по прочитаних заявках і почищений
      вручну. Precision/recall не заміряні: потрібна ручна розмітка 300-400
      заявок. Після КОЖНОЇ правки словника треба перекалібровувати пороги
      стадій — інакше вони тихо зʼїжджають.

  # ── Напруга і сегменти (рівень людини) ───────────────────────────────────
  - id: OPS-042
    label: Ризикові будинки
    definition: >
      Будинки, де склад населення в найгіршому перцентилі портфеля, або де
      є революціонер і будинок при цьому вже в конфлікті.
    formula: >
      частка напружених мешканців > p95 портфеля І >= 3 таких мешканці,
      АБО (>= 1 революціонер І максимальна сходинка за 6 місяців >= 2)
    grain: house_id x report_month
    source: dbt_operational.mart_house_segment_mix_monthly
    owner: Артем
    status: needs_decision
    note: >
      Друга вісь ризику, поруч зі сходинкою конфлікту і згасанням. Осі не
      складаються в одне число: сходинка каже «що відбувається», склад —
      «хто живе», згасання — «чи з нами ще розмовляють».
      ⚠️ Дві правки до вихідної моделі Макса, обидві з перевірки на даних.
      Знаменник — АКТИВНІ мешканці, не квартири: з квартирами максимум по
      портфелю 4,8%, а поріг «Noisy» починався з 21% — три статуси з
      чотирьох не спрацювали б ніколи. Пороги — перцентилі всередині
      портфеля, бо частка напружених це властивість аудиторії ЖК
      (комфорт-клас проти «Ліпінки», де за рік нуль ескалацій).
      ⚠️ Голе правило «один революціонер = ризиковий» ловить 4 будинки з 13,
      що пішли, і піднімає 25 живих — тому додано контекст сходинки.
      Поріг потребує рішення Артема.

  - id: OPS-043
    label: Напружених мешканців
    definition: >
      Мешканці, чий бал напруги за останні три місяці вище 20 — тобто
      «Неспокійний», «Тривожник» або «Революціонер» за шкалою 0-100.
    formula: >
      сума балів за сигналами (текст заявки 15/8/0, оцінка 10/4/0) за
      вікном 3 місяці, стеля 100, плюс floor-правила: згадка ОСББ за рік
      або участь в ескалаційній кампанії піднімають щонайменше до 41
    grain: citizen_id x report_month
    source: dbt_operational.fct_resident_friction_monthly
    owner: Артем
    status: needs_decision
    note: >
      ⚠️ ВІКНО, а не накопичення. Та сама шкала дає 1 революціонера на
      90 днях, 38 на 12 місяцях і 128 на всій історії — вибір вікна змінює
      відповідь у 50 разів, а бал, який уміє тільки рости, через два роки
      фарбує весь портфель.
      ⚠️ Floor-правила потрібні, бо лінійна сума недооцінює рідкісний
      вирішальний сигнал: згадка ОСББ дає +15 і лишає людину «Спокійною»,
      хоча це найсильніша відома ознака — 12 із 13 будинків, що пішли,
      мали такі згадки.
      ⚠️ Пороги сегментів (0-20 / 21-40 / 41-79 / 80-100) — з дошки Макса,
      на історії виходу не перевірені: розмітки «ця людина справді
      організовувала ОСББ» у нас немає.

  - id: OPS-044
    label: Революціонерів
    definition: >
      Мешканці з балом напруги 80-100 за останні три місяці — верхній
      сегмент шкали.
    grain: citizen_id x report_month
    source: dbt_operational.fct_resident_friction_monthly
    owner: Артем
    status: needs_decision
    note: >
      «Вічний тег» з дошки Макса реалізовано як ІСТОРІЮ (peak_segment_no,
      ever_osbb_intent), а не як незмивний ярлик: людина може бути
      спокійною зараз і мати пік у минулому. Так зберігається намір
      (не губимо з фокусу) без профілювання, яке не можна показати клієнту.

  - id: OPS-045
    label: Організаторів
    definition: >
      Мешканці, що брали участь у двох і більше ескалаційних кампаніях за
      рік, або в одній разом із юридичними заявками чи зверненням від
      імені групи.
    grain: citizen_id x report_month
    source: dbt_operational.fct_resident_friction_monthly
    owner: Артем
    status: active
    note: >
      Сегмент ДІЇ, ортогональний шкалі напруги: шкала каже, наскільки
      гаряче, сегмент — що робити. Однаковий бал в організатора і в
      хронічного скаржника означає протилежні дії (переговори проти
      нормально закритих заявок).
      Незалежна оцінка розміру ядра з першого аудиту — 79 людей з 4+
      ескалаційними заявками за рік — сходиться з цим числом за порядком.

  - id: OPS-046
    label: Мовчунів
    definition: >
      Мешканці, які писали заявки щонайменше пів року (6+ заявок у вікні
      M-12..M-4), а за останні три місяці не написали жодної.
    grain: citizen_id x report_month
    source: dbt_operational.fct_resident_friction_monthly
    owner: Микита
    status: active
    note: >
      Окремий прапорець, а не сходинка шкали: перед виходом будинок
      частіше ЗАМОВКАЄ, ніж шумить. У «Севен» 16-Г за 12 місяців до виходу
      не було жодного мешканця вище «Спокійного» — за шкалою напруги це
      зразковий спокійний будинок.

  # ── Задоволеність мешканців (CSAT) ───────────────────────────────────────
  - id: OPS-047
    label: Інтегральна оцінка
    definition: >
      Сума середніх оцінок за трьома напрямками опитувань (Прибудинкова +
      Будинкова + Охорона) за останніми хвилями. Діапазон 0-15, а не 1-5.
    formula: avg(Прибудинкова) + avg(Будинкова) + avg(Охорона)
    grain: complex_id
    source: dbt_operational.mart_survey_complex_integral
    owner: Микита
    status: active
    note: >
      Так, це СУМА середніх, а не середня — і це навмисно. Сенс формули: ЖК
      має бути добрим за всіма напрямками одразу, і провал в одному не
      компенсується успіхом в іншому так, як його згладила б звичайна
      середня. Формула авторська, перенесена з ручного xlsx-звіту 1:1.
      NULL, якщо хоч однієї складової немає — «немає даних», а не нуль;
      такий ЖК у рейтинг не ставимо.

  - id: OPS-048
    label: Інтегральний УК
    definition: >
      Те саме, але тільки за двома напрямками власної роботи компанії —
      прибудинкова територія і будинок. Діапазон 0-10. За ним будується
      місце в рейтингу.
    formula: avg(Прибудинкова) + avg(Будинкова)
    grain: complex_id
    source: dbt_operational.mart_survey_complex_integral
    owner: Микита
    status: active
    note: >
      Рейтинг рахується саме за цим показником, а не за загальним: охорона —
      це підрядник, якого міняють, а територія й будинок — власна робота.
      Перевірено, що в ручному звіті було так само: «Правий берег» з 5,84
      стоїть там вище за «Варшавський» з 9,25 загального, тобто сортування
      йшло за УК.

  - id: OPS-049
    label: Середня оцінка
    definition: >
      Середній бал по всіх голосах останніх хвиль трьох категорій, за
      п'ятибальною шкалою.
    formula: SUM(grade_sum) / SUM(votes)
    grain: wave × complex_id × house_id
    source: dbt_operational.mart_survey_wave_summary
    owner: Микита
    status: active
    note: >
      ⚠️ Рахується як сума балів / кількість голосів, НІКОЛИ як середня з
      готових середніх по будинках — інакше будинок із двома голосами важить
      стільки ж, скільки будинок із двомастами. Саме тому марта віддає
      `grade_sum`, а не готовий `avg_grade`.

  - id: OPS-050
    label: Оцінок 1–2 в опитуваннях
    definition: >
      Яка частка голосів в останніх хвилях опитувань — це 1 або 2 бали.
    formula: SUM(grade_1 + grade_2) / SUM(votes)
    grain: wave × complex_id × house_id
    source: dbt_operational.mart_survey_wave_summary
    owner: Микита
    status: active
    note: >
      ⚠️ НЕ плутати з «Часткою оцінок 1–2» (OPS-040) на сторінці ризику
      відтоку: там джерело — оцінки ЗАКРИТТЯ ЗАЯВКИ (order_reviews) за
      ковзні три місяці, тут — голоси в опитуванні. Різні події, різні люди,
      різні числа. Назви розведені саме тому, що довідка на дашборді
      шукається за підписом картки, і однакові підписи мовчки показували б
      чужий опис.

  - id: OPS-051
    label: Участь
    definition: >
      Яка частка підтверджених користувачів узяла участь в останніх хвилях
      опитувань.
    formula: SUM(votes_latest) / SUM(n_users_confirmed)
    grain: complex_id
    source: dbt_operational.mart_survey_complex_integral
    owner: Микита
    status: active
    note: >
      Знаменник — ПІДТВЕРДЖЕНІ користувачі, а не всі рахунки: людина без
      застосунку опитування просто не бачить, і рахувати її в знаменнику
      означало б звинувачувати опитування в тому, що вона не встановила
      додаток. Частка від усіх рахунків теж є в марті
      (`reach_of_accounts`) — для порівняння з ручним звітом, який брав саме
      її. Аудиторія береться з живого mart_monthly_complex_overview, а не зі
      статичного «Довідника ЖК», як у xlsx.

  - id: OPS-052
    label: Рейтинг ЖК
    definition: >
      Таблиця всіх ЖК: оцінка за кожним напрямком, інтегральні бали, місце,
      голоси й участь. Центральна таблиця сторінки.
    formula: поля mart_survey_complex_integral без агрегації
    grain: complex_id
    source: dbt_operational.mart_survey_complex_integral
    owner: Микита
    status: active
    note: >
      Береться ОСТАННЯ хвиля кожної категорії, визначена по всьому портфелю.
      Якщо в конкретному ЖК за неї ніхто не проголосував — прочерк, стару
      хвилю не підставляємо: інакше ЖК тихо жив би зі старою оцінкою.
      ⚠️ Відмінність від замороженого xlsx: там «Охорона» бралась
      передостання, бо липнева хвиля була ще проміжна. Тепер вона завершена,
      і модель їде за свіжістю сама, без ручного вибору.

  - id: OPS-053
    label: Оцінка по хвилях
    definition: >
      Динаміка середньої оцінки кожної категорії від хвилі до хвилі, плюс
      скільки людей узяло участь і скільки лишило текст.
    formula: SUM(grade_sum) / SUM(votes) по wave_label
    grain: wave × complex_id × house_id
    source: dbt_operational.mart_survey_wave_summary
    owner: Микита
    status: active
    note: >
      Вісь — ХВИЛІ, не місяці. Опитування йдуть нерівномірно (в одному
      місяці дві хвилі, в іншому жодної), тому на цій сторінці немає
      дейт-пікера: місячний діапазон обіцяв би вибір, якого в даних немає.
      Лінія рветься там, де хвилі цієї категорії не було — це факт розкладу,
      а не пропуск даних.

  - id: OPS-054
    label: Матриця ЖК × хвиля
    definition: >
      Середня оцінка й кількість голосів для кожної пари «ЖК × хвиля».
    formula: SUM(grade_sum) / SUM(votes) по complex_id × wave_label
    grain: wave × complex_id × house_id
    source: dbt_operational.mart_survey_wave_summary
    owner: Микита
    status: active
    note: >
      Excel-вивантаження цієї панелі йде на грануляції БУДИНКА (не ЖК) — це
      той самий зріз, що лист «Дані» ручного звіту, і саме з ним працює
      операційка.

  - id: OPS-055
    label: Розподіл оцінок
    definition: >
      Скільки голосів припало на кожен бал від 5 до 1 в останніх хвилях.
    formula: SUM(grade_5) … SUM(grade_1)
    grain: wave × complex_id × house_id
    source: dbt_operational.mart_survey_wave_summary
    owner: Микита
    status: active

  - id: OPS-056
    label: Участь по ЖК
    definition: >
      Той самий показник участі, розбитий по ЖК — видно, де опитування
      реально дійшло до людей, а де цифра стоїть на десятку голосів.
    formula: votes_latest / n_users_confirmed по ЖК
    grain: complex_id
    source: dbt_operational.mart_survey_complex_integral
    owner: Микита
    status: active
    note: >
      Читати рейтинг ЖК треба разом із цією колонкою: оцінка ЖК з участю 5%
      і оцінка ЖК з участю 30% — це різні за надійністю числа.

  - id: OPS-057
    label: Про що пишуть
    definition: >
      Розбір негативних коментарів (оцінка 1–3) за темами: шість верхніх
      категорій і детальніші теми всередині них.
    formula: >
      COUNT(DISTINCT answer_id) по problem_category_ua / problem_theme_ua
      з int_survey_comment_flags
    grain: answer_id × problem_theme_ua
    source: dbt_operational.int_survey_comment_flags (seed survey_problem_lexicon)
    owner: Микита
    status: known_issue
    note: >
      Відтворює розділ «Аналіз проблем» ручного xlsx-звіту, але як дані, а не
      як разову класифікацію: наступна хвиля розкладається сама.
      ⚠️ Один коментар потрапляє в КОЖНУ свою тему, тому сума по темах
      більша за кількість коментарів. Це навмисно — люди пишуть про все
      одразу, і вибір «однієї головної теми» викидав би половину сказаного.
      ⚠️ Словник v1, зібраний по ~60 прочитаних коментарях. Покриття — 87%
      негативних коментарів, precision НЕ заміряна. Дві помилки вже
      знайдені й виправлені на етапі збірки: патерн «бот» ловив «роботу»
      (32 збіги, усі хибні), «компані» ловив «охоронна компанія». Перед
      додаванням нового патерна — прогнати на реальних коментарях.

  - id: OPS-058
    label: Рівень критичності
    definition: >
      Частка негативних коментарів (1–3) серед усіх коментарів ЖК, з
      градацією: критичний >= 80%, високий 60-79%, середній нижче.
    formula: COUNT(is_negative) / COUNT(*) по ЖК, серед ЖК з 10+ коментарями
    grain: answer_id
    source: dbt_operational.mart_survey_comments
    owner: Микита
    status: known_issue
    note: >
      ⚠️ Знаменник — ті, хто ЗАЛИШИВ ТЕКСТ, а не всі респонденти. Люди
      частіше пишуть, коли незадоволені, тому 80%+ негативу тут — норма
      жанру, а не катастрофа. Пороги перенесені з ручного звіту як є; вони
      корисні для порівняння ЖК між собою, але як абсолютну оцінку
      «критично / не критично» читати їх не можна.

  - id: OPS-059
    label: Коментарі
    definition: >
      Стрічка текстових відповідей мешканців із фільтрами по ЖК, темі й
      оцінці.
    formula: mart_survey_comments, фільтри з параметрів URL
    grain: answer_id
    source: dbt_operational.mart_survey_comments
    owner: Микита
    status: active
    note: >
      Персональних ідентифікаторів немає навмисно: ні user_id, ні номера
      квартири — найдрібніший розріз, який їде на дашборд, це будинок.
      Текст мешканця при цьому може містити імена конкретних працівників —
      так само, як у поточному звіті Looker; аудиторія та сама, під
      Google-логіном.
      Фільтри пишуться в URL, тому посилання на «всі скарги на охорону в
      Окленді» можна переслати керівнику ЖК як є.
