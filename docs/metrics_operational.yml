# Реєстр метрик ОПЕРАЦІЙНОГО дашборду — машинний источник правди
#
# Окремий файл від docs/metrics.yml (продуктовий) навмисно: кожен застосунок
# компілює свій реєстр і має власну перевірку покриття
# (scripts/check-metric-coverage.mjs падає, якщо на дашборді зʼявилась картка
# без запису). В одному спільному файлі перевірка кожного застосунку бачила б
# половину записів як «сирітські» і перестала б щось означати.
#
# Поля — ті самі, що в docs/metrics.yml:
#   label / definition / formula / grain / source / owner / status / note

version: 1
updated: 2026-08-11

metrics:
  # ── Операційне · Огляд ЖК ────────────────────────────────────────────────
  - id: OPS-006
    label: Будинків
    definition: >
      Активні житлові будинки станом на кінець місяця, по всій компанії.
    formula: SUM(n_houses_active) по всіх ЖК
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview
    owner: Микита
    status: active
    note: >
      Point-in-time на deactivated_at КОНКРЕТНОГО місяця, не поточний статус
      — деактивований будинок перестає рахуватись з місяця деактивації, а не
      заднім числом і не назавжди «як був». Паркінгові будівлі без жодної
      квартири виключені (is_residential) — це і закрило розбіжність
      "будинків 132 vs 110" з аудиту Looker-дашборду.

  - id: OPS-007
    label: Квартир
    definition: >
      Квартири в активних житлових будинках, по всій компанії. Той самий
      point-in-time фільтр, що й «Будинків» — квартири вже деактивованого
      будинку (мешканці виїхали з-під УК) не рахуються в поточному інвентарі.
    formula: SUM(n_apartments) по всіх ЖК
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview
    owner: Микита
    status: active
    note: >
      На сторінці «Приміщення» поруч показані паркінг і комерція — окремими
      лініями, бо порядок величин відрізняється (квартир на порядок більше).

  - id: OPS-008
    label: Користувачів
    definition: >
      Уся база користувачів, привʼязаних до приміщення хоч раз, по всій
      компанії — незалежно від того, чи підтвердились і чи заходили в
      застосунок.
    formula: SUM(n_users_total) по всіх ЖК
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview (fct_users_monthly)
    owner: Микита
    status: active
    note: >
      Рахується з тієї самої моделі виключень (`int_user_exclusions`), що й
      PROD-001 на продуктовому дашборді — числа мають збігатися. Якщо
      розійшлися, шукати різницю в даті зрізу, а не в методології: джерело
      одне.

  - id: OPS-009
    label: Підтверджені
    definition: >
      Верифіковані користувачі, не деактивовані — ні як роль, ні через вихід
      будинку з-під управління.
    formula: SUM(n_users_confirmed) / SUM(n_users_total) по всіх ЖК
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview
    owner: Микита
    status: active
    note: >
      Аналог PROD-002 продуктового дашборду, тут — у розрізі ЖК замість
      єдиної цифри по компанії.

  - id: OPS-010
    label: Приміщення
    definition: >
      Квартири, паркомісця та комерційні приміщення в активних будинках,
      по всій компанії, у динаміці.
    formula: SUM(n_apartments), SUM(n_parking), SUM(n_commercial) по всіх ЖК
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview
    owner: Микита
    status: active

  - id: OPS-011
    label: Розріз по ЖК
    definition: >
      Ті самі метрики компанії (будинки, квартири, користувачі, частка
      підтверджених), розбиті по кожному ЖК за обраний місяць.
    formula: ті самі поля mart_monthly_complex_overview, без агрегації
    grain: complex_id × report_month
    source: dbt_operational.mart_monthly_complex_overview
    owner: Микита
    status: active
    note: >
      ЖК без жодного будинку/квартири/користувача в місяці приховані з
      таблиці (QA-комплекси на кшталт "Форест"/БЦ "Арсенал" — уже виключені
      seed'ом test_complexes, лишаються нульові технічні записи). Севен може
      мати 0 будинків, але ненульових користувачів — паркінг-будинок
      лишається активним, коли житлові вже деактивовані; це не помилка.

  # ── Операційне · Ризик відтоку ──────────────────────────────────────────
  - id: OPS-001
    label: Будинків у зоні уваги
    definition: >
      Скільки житлових будинків станом на місяць мають ознаки руху до виходу
      з-під управління — або конфліктну траєкторію (стадія 2 і вище), або
      мовчазне згасання активності.
    formula: COUNT(*) WHERE needs_attention = стадія >= 2 OR is_fading
    grain: house_id × report_month
    source: dbt_operational.mart_house_churn_risk_monthly
    owner: Артем
    status: needs_decision
    note: >
      Це ПРІОРИТИЗАТОР черги роботи, а не оцінка ймовірності. Подій виходу
      за три роки лише 13 — навчати на них модель нема на чому, тому пороги
      підібрані по перцентилях розподілу (p80-p90) і задокументовані прямо
      в моделі. Перевірка на історії: прапорець піднявся в 11 із 13
      будинків, що реально пішли. Не спрацював на «Варшавський» 20-А і
      Севен 20-Б — обидва пішли, майже не лишивши слідів у застосунку.

  - id: OPS-002
    label: Організація і вище
    definition: >
      Будинки на стадіях 3-5: є координована група мешканців, заявлений
      намір вийти або вже зафіксований вихід.
    formula: COUNT(*) WHERE risk_stage >= 3
    grain: house_id × report_month
    source: dbt_operational.mart_house_churn_risk_monthly
    owner: Артем
    status: active
    note: >
      Сходинки: 0 норма, 1 роздратування (оцінки 1-2 понад 60%),
      2 юридизація (вимоги документів і посилання на договір),
      3 організація (ескалаційна кампанія), 4 намір (пряма згадка ОСББ або
      зміни УК), 5 пішли. Беремо НАЙВИЩУ, що спрацювала. Порядок 2 < 3
      навмисний: юридична лексика зустрічається набагато частіше за
      кампанії.

  - id: OPS-003
    label: Будинків у згасанні
    definition: >
      Будинки, де активність у застосунку впала нижче половини власної бази
      і тримається так три місяці поспіль.
    formula: >
      заявок за 3 міс / міс < 0.5 × (заявок за міс M-12..M-4 / 9),
      три місяці поспіль
    grain: house_id × report_month
    source: dbt_operational.mart_house_churn_risk_monthly
    owner: Артем
    status: active
    note: >
      Окремий прапорець, а НЕ сходинка: будинок може згасати без жодного
      конфлікту (ЖК «Севен» — саме цей сценарій), і навпаки. Складати два
      режими в одну шкалу не можна. Пастка, через яку прапорець і зʼявився:
      база рахується по власних місяцях будинку, тож при повільному
      згасанні вона сповзає слідом за падінням і поріг обвалу не
      пробивається ніколи — Севен 18-А впав із ~60 заявок на місяць до ~25
      за рік, і жодна сходинка не спрацювала.

  - id: OPS-004
    label: Частка оцінок 1–2
    definition: >
      Яка частка оцінок, поставлених мешканцями при ЗАКРИТТІ заявки, — це
      1 або 2 бали. Ковзні три місяці по всьому портфелю.
    formula: SUM(оцінок 1-2 за 3 міс) / SUM(усіх оцінок за 3 міс)
    grain: house_id × report_month
    source: dbt_operational.mart_house_churn_risk_monthly (order_reviews)
    owner: Артем
    status: active
    note: >
      Найсильніший чистий корелят токсичності: при контролі обсягу звернень
      звʼязок із часткою негативу 0.35 проти 0.36 у кількості аварій. Тобто
      токсичність породжують не поломки, а погано закриті заявки.
      ⚠️ CSAT-опитування сюди НЕ входять: 3 750 із 3 794 відповідей не мають
      house_id, бо голосування створюється одне на весь ЖК. Поки технічна
      команда не збереже обрану адресу при голосуванні, єдине джерело
      оцінок з привʼязкою до будинку — оцінки закриття заявок.

  - id: OPS-005
    label: Ескалаційні кампанії
    definition: >
      Випадки, коли троє й більше різних мешканців одного ЖК подали заявки
      майже однаковим текстом протягом двох тижнів, і в тексті є юридична
      вимога, звернення від імені групи або згадка ОСББ.
    formula: >
      >= 3 різних citizen_id І >= 3 різних created_by_id на однаковий
      префікс тексту (45 символів), розрив між заявками <= 14 днів
    grain: campaign_id
    source: dbt_operational.mart_campaigns
    owner: Артем
    status: known_issue
    note: >
      Умова «>= 3 різних АВТОРИ записи» не дублює першу і критична: без неї
      детектор забивається диспетчерськими шаблонами, де citizen_id різні,
      а пише їх один оператор.
      ⚠️ Детектор ловить СИНХРОННІСТЬ, а не тиск: зі 121 знайденої кампанії
      ескалаційних лише 19, решта — побутові збіги («Перезапустіть
      котельню, потухла» від пʼятьох за годину). У стадію рахуються тільки
      ескалаційні; побутові лишились окремою колонкою, бо операційно вони
      корисні (одна аварія = пʼять заявок).
      ⚠️ Словник маркерів — v1, зібраний по прочитаних заявках і почищений
      вручну. Precision/recall не заміряні: потрібна ручна розмітка 300-400
      заявок. Після КОЖНОЇ правки словника треба перекалібровувати пороги
      стадій — інакше вони тихо зʼїжджають.

  # ── Напруга і сегменти (рівень людини) ────────────────────────────────

  - id: OPS-012
    label: Ризикові будинки
    definition: >
      Будинки, де склад населення в найгіршому перцентилі портфеля, або де
      є революціонер і будинок при цьому вже в конфлікті.
    formula: >
      частка напружених мешканців > p95 портфеля І >= 3 таких мешканці,
      АБО (>= 1 революціонер І максимальна сходинка за 6 місяців >= 2)
    grain: house_id x report_month
    source: dbt_operational.mart_house_segment_mix_monthly
    owner: Артем
    status: needs_decision
    note: >
      Друга вісь ризику, поруч зі сходинкою конфлікту і згасанням. Осі не
      складаються в одне число: сходинка каже «що відбувається», склад —
      «хто живе», згасання — «чи з нами ще розмовляють».
      ⚠️ Дві правки до вихідної моделі Макса, обидві з перевірки на даних.
      Знаменник — АКТИВНІ мешканці, не квартири: з квартирами максимум по
      портфелю 4,8%, а поріг «Noisy» починався з 21% — три статуси з
      чотирьох не спрацювали б ніколи. Пороги — перцентилі всередині
      портфеля, бо частка напружених це властивість аудиторії ЖК
      (комфорт-клас проти «Ліпінки», де за рік нуль ескалацій).
      ⚠️ Голе правило «один революціонер = ризиковий» ловить 4 будинки з 13,
      що пішли, і піднімає 25 живих — тому додано контекст сходинки.
      Поріг потребує рішення Артема.

  - id: OPS-013
    label: Напружених мешканців
    definition: >
      Мешканці, чий бал напруги за останні три місяці вище 20 — тобто
      «Неспокійний», «Тривожник» або «Революціонер» за шкалою 0-100.
    formula: >
      сума балів за сигналами (текст заявки 15/8/0, оцінка 10/4/0) за
      вікном 3 місяці, стеля 100, плюс floor-правила: згадка ОСББ за рік
      або участь в ескалаційній кампанії піднімають щонайменше до 41
    grain: citizen_id x report_month
    source: dbt_operational.fct_resident_friction_monthly
    owner: Артем
    status: needs_decision
    note: >
      ⚠️ ВІКНО, а не накопичення. Та сама шкала дає 1 революціонера на
      90 днях, 38 на 12 місяцях і 128 на всій історії — вибір вікна змінює
      відповідь у 50 разів, а бал, який уміє тільки рости, через два роки
      фарбує весь портфель.
      ⚠️ Floor-правила потрібні, бо лінійна сума недооцінює рідкісний
      вирішальний сигнал: згадка ОСББ дає +15 і лишає людину «Спокійною»,
      хоча це найсильніша відома ознака — 12 із 13 будинків, що пішли,
      мали такі згадки.
      ⚠️ Пороги сегментів (0-20 / 21-40 / 41-79 / 80-100) — з дошки Макса,
      на історії виходу не перевірені: розмітки «ця людина справді
      організовувала ОСББ» у нас немає.

  - id: OPS-014
    label: Революціонерів
    definition: >
      Мешканці з балом напруги 80-100 за останні три місяці — верхній
      сегмент шкали.
    grain: citizen_id x report_month
    source: dbt_operational.fct_resident_friction_monthly
    owner: Артем
    status: needs_decision
    note: >
      «Вічний тег» з дошки Макса реалізовано як ІСТОРІЮ (peak_segment_no,
      ever_osbb_intent), а не як незмивний ярлик: людина може бути
      спокійною зараз і мати пік у минулому. Так зберігається намір
      (не губимо з фокусу) без профілювання, яке не можна показати клієнту.

  - id: OPS-015
    label: Організаторів
    definition: >
      Мешканці, що брали участь у двох і більше ескалаційних кампаніях за
      рік, або в одній разом із юридичними заявками чи зверненням від
      імені групи.
    grain: citizen_id x report_month
    source: dbt_operational.fct_resident_friction_monthly
    owner: Артем
    status: active
    note: >
      Сегмент ДІЇ, ортогональний шкалі напруги: шкала каже, наскільки
      гаряче, сегмент — що робити. Однаковий бал в організатора і в
      хронічного скаржника означає протилежні дії (переговори проти
      нормально закритих заявок).
      Незалежна оцінка розміру ядра з першого аудиту — 79 людей з 4+
      ескалаційними заявками за рік — сходиться з цим числом за порядком.

  - id: OPS-016
    label: Мовчунів
    definition: >
      Мешканці, які писали заявки щонайменше пів року (6+ заявок у вікні
      M-12..M-4), а за останні три місяці не написали жодної.
    grain: citizen_id x report_month
    source: dbt_operational.fct_resident_friction_monthly
    owner: Микита
    status: active
    note: >
      Окремий прапорець, а не сходинка шкали: перед виходом будинок
      частіше ЗАМОВКАЄ, ніж шумить. У «Севен» 16-Г за 12 місяців до виходу
      не було жодного мешканця вище «Спокійного» — за шкалою напруги це
      зразковий спокійний будинок.
