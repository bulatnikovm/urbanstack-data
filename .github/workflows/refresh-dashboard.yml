name: Оновити дашборди

# Раз на добу, після нічного Stitch-синку (~02:00 UTC — CLAUDE.md §2.4).
# workflow_dispatch — щоб можна було запустити руками з вкладки Actions,
# не чекаючи розкладу, коли треба перевірити свіжі дані одразу.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Пише коміти в цей репозиторій — потрібен явний запис, бо
# GITHUB_TOKEN за замовчуванням лише читає.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Окремого кроку деплою тут НЕМАЄ навмисно. Раніше web/ виносився
    # `git subtree split` у другий репозиторій (urbanstack-dashboard), до
    # якого був підключений Vercel — і це вимагало другого токена з правом
    # запису в чужий репозиторій. Саме цей крок і падав з 403.
    #
    # Тепер Vercel дивиться прямо в цей репозиторій (Root Directory = web),
    # тож достатньо звичайного коміту нижче: Vercel бачить пуш і
    # перезбирається сам. Мінус два звена й один секрет.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Автентифікація в GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановити dbt
        run: pip install "dbt-core==1.12.0" dbt-bigquery

      - name: Профіль dbt
        # Той самий підхід, що й у README для локального запуску, тільки
        # method: oauth тут читає ADC, який щойно виставив auth-крок вище
        # (без нього був би `gcloud auth application-default login`, якого
        # в CI немає й не буде — сервіс-акаунт саме для цього).
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          urbanstack:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: oauth
                project: analytics-454817
                dataset: dbt_finance
                location: EU
                threads: 4
          EOF

      # Теги заявок живуть не в Stitch-репліці (`postgresqldim9000` не має їх
      # жодною колонкою), а в окремому внутрішньому продукті `dim9000_fast`,
      # який синхронізується в US. BigQuery не джойнить між регіонами, тому
      # перед збіркою копіюємо дві крихітні таблиці в EU-дзеркало.
      #
      # `bq cp -f` уміє крос-регіон і перезаписує ціль повністю — стан
      # дзеркала завжди дорівнює джерелу, накопичення не буває. ~40 с на
      # обидві таблиці.
      #
      # ⚠️ Крок НЕ падає, якщо копія не вдалась: дашборд без свіжих тегів
      # корисніший за дашборд, який не оновився взагалі. Ознака проблеми —
      # `max(report_month_key)` у web/data/operational/agg_tags_monthly.json
      # відстає від решти вивантажень.
      - name: gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Синхронізувати теги (US → EU)
        continue-on-error: true
        # Крос-регіонна копія зазвичай ~20-40 с на таблицю, але час плаває
        # (одного разу локально друга таблиця не вклалась у 10 хв). Без
        # ліміту зависла копія тримала б увесь нічний прогін; із ним крок
        # просто відвалиться, а `continue-on-error` пропустить далі —
        # дашборд оновиться зі вчорашніми тегами.
        timeout-minutes: 6
        run: |
          for t in tags task_tags_links; do
            bq --project_id=analytics-454817 cp -f \
              "analytics-454817:dim9000_fast.$t" \
              "analytics-454817:dim9000_fast_eu.$t"
          done

      - name: dbt build
        working-directory: dbt
        run: |
          dbt deps
          dbt build

      - name: Node
        uses: actions/setup-node@v4
        with:
          # Та сама версія, що локально (npm ci впав з "Missing from lock
          # file" на 22-й — package-lock.json генерувався npm 11, який
          # іде в парі з Node 24, і структура лока трохи різна між
          # мажорними версіями npm).
          node-version: "24"

      # Один застосунок на обидва дашборди: продуктовий у корені,
      # операційний під /operations. `export-data` всередині послідовно
      # вивантажує обидва домени (data/ і data/operational/), а
      # `build-metrics` збирає ОБИДВА реєстри в один data/metrics.json.
      - name: Вивантажити марти й реєстр метрик
        working-directory: web
        run: |
          npm ci
          npm run export-data
          npm run build-metrics

      - name: Закомітити свіжі дані — Vercel підхопить пуш сам
        run: |
          git config user.name "urbanstack-bot"
          git config user.email "analytics@dim9000.com"
          git add web/data/
          if git diff --cached --quiet; then
            echo "Дані не змінились — коміт не потрібен, деплою теж не буде"
          else
            git commit -m "chore(data): автооновлення $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin HEAD:main
            echo "Дані оновлено — Vercel перезбирає дашборд"
          fi
