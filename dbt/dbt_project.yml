name: 'urbanstack_dbt'
version: '1.0.0'
config-version: 2

profile: 'urbanstack'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  urbanstack_dbt:
    staging:
      +materialized: view
      operational:
        +schema: dbt_operational
      surveys:
        +schema: dbt_operational
      product:
        +schema: dbt_product
    intermediate:
      +materialized: view
      operational:
        +schema: dbt_operational
      surveys:
        +schema: dbt_operational
      product:
        +schema: dbt_product
    marts:
      +materialized: table
      operational:
        +schema: dbt_operational
      surveys:
        +schema: dbt_operational
      product:
        +schema: dbt_product

seeds:
  urbanstack_dbt:
    test_complexes:
      +schema: dbt_operational
    dim_order_category:
      +schema: dbt_operational
    dim_order_type:
      +schema: dbt_operational
    negativity_lexicon:
      +schema: dbt_operational
      +column_types:
        weight: int64
    product_event_catalog:
      +schema: dbt_product
    product_module_catalog:
      +schema: dbt_product
