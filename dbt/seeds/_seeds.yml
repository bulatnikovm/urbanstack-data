version: 2

seeds:
  - name: test_complexes
    description: >
      Хардкод-список QA/тестових ЖК, які треба виключати з operational-метрик.
      dashboard_rebuild_plan.md 1.1 — заміна copy-paste хардкоду в Looker-запитах.
    columns:
      - name: complex_id
        tests:
          - not_null
          - unique

  - name: survey_wave_catalog
    description: >
      Allowlist реальних хвиль CSAT-опитувань (охорона/прибудинкова/будинкова) —
      відсікає тестові/дев-опитування, які живуть в тому ж id-просторі surveys.
    columns:
      - name: wave_description
        tests:
          - not_null
          - unique
