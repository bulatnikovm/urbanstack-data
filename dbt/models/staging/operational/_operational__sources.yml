version: 2

sources:
  - name: postgresqldim9000_operational
    description: >
      Заявки/SLA/користувачі з тієї ж Stitch-sync Postgres БД. Окремий
      source-блок за конвенцією postgresqldim9000_geo/postgresqldim9000_surveys
      — фізично той самий датасет.
    database: analytics-454817
    schema: postgresqldim9000
    tables:
      - name: orders
        description: >
          Заявка мешканця. category/type — сирі enum, переклад через seed
          dim_order_category/dim_order_type (консолідація 3-4 розбіжних CASE,
          знайдених в аудиті Looker — OPS-003).
        columns:
          - name: id
            tests:
              - not_null
              - unique
      - name: order_tasks
        description: >
          Внутрішня задача по заявці (order_id NOT NULL) АБО задача
          співробітника без заявки (order_id IS NULL). category — той самий
          enum, що і orders.category. status — ІНШИЙ enum (closed/canceled/
          in_progress/assigned/done), не плутати з orders.status.
      - name: tasks_locations
        description: >
          Гео задачі (1:1 до order_tasks по task_id). Єдине джерело ЖК/будинку
          для задач співробітників (order_id IS NULL) — у них немає заявки, а
          отже й space_id, через який будується гео решти. complex_id
          заповнений у 100% рядків, house_id — у 89%.
        columns:
          - name: task_id
            tests:
              - not_null
              - unique
      - name: order_reviews
        description: >
          Оцінка мешканцем ЗАКРИТТЯ заявки (rating 1-5 + comment). Єдине
          джерело оцінок задоволеності з прив'язкою до будинку: CSAT-опитування
          дають house_id лише в 44 із 3 794 відповідей (голосування створюється
          одне на весь ЖК). ~16 тис. рядків з 2022-05.
        columns:
          - name: id
            tests:
              - not_null
              - unique
      - name: history_order_updates
        description: >
          Event log змін заявки, before/after RECORD зі вкладеним status.
          Джерело для event-based fact_order_events (створено/виконано/скасовано).
      - name: history_task_updates
        description: Аналогічний event log для order_tasks.
      - name: statistic_citizen
        description: Місячний снапшот користувачів по ЖК (total/confirmed/active/owner).
      - name: users
        description: Користувачі додатку, role визначає мешканця/співробітника.
      - name: space_user
        description: Зв'язка user_id × space_id (без ролі/дати — довідник прив'язки).

  - name: dim9000_fast_eu
    description: >
      EU-ДЗЕРКАЛО двох таблиць з датасету `dim9000_fast` (US) — теги заявок.

      Чому дзеркало, а не пряме джерело: BigQuery не джойнить між регіонами,
      а весь операційний шар живе в EU. Теги ж потрапили не в Stitch-репліку
      продуктової Postgres (`postgresqldim9000` — там їх немає ЖОДНОЮ
      колонкою, перевірено по всіх 61 таблиці), а в окремий внутрішній
      продукт `dim9000_fast`, який синхронізується в US.

      Наповнюється кроком «Синхронізувати теги» в
      `.github/workflows/refresh-dashboard.yml` (`bq cp -f`, ~40 с на обидві
      таблиці) ПЕРЕД `dbt build`. Джерело правди — `dim9000_fast`; тут лише
      копія, редагувати руками нічого не можна.

      ⚠️ Якщо теги колись поїдуть у Stitch-репліку — це джерело треба
      прибрати, а не тримати два. Дзеркало існує рівно через регіон.
    database: analytics-454817
    schema: dim9000_fast_eu
    tables:
      - name: tags
        description: >
          Довідник тегів, 35 рядків, три незалежні простори в полі `type`:
          `task` (13 тегів заявки/задачі — саме вони в CRM на сторінці
          «Заявки»), `debtor` (19 статусів претензійної роботи) і `user`
          (3 мітки мешканця). Операційний дашборд бере ЛИШЕ `task`.
        columns:
          - name: id
            tests:
              - not_null
              - unique
      - name: task_tags_links
        description: >
          Зв'язка тег × ЗАДАЧА (не заявка). Заявка отримує тег через свої
          задачі — `order_tasks.order_id`. З 6 938 звʼязок 1 683 висять на
          задачах співробітника без заявки, тож до заявок доходить ~5,2 тис.
          Ідентифікатор задачі спільний з EU-реплікою (перевірено: 5 760 з
          5 765 task_id знаходяться в postgresqldim9000.order_tasks).
          Сурогатного ключа немає — рівно дві колонки, ключ це пара.
