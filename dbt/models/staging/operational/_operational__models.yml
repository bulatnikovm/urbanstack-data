version: 2

models:
  - name: stg_dim9000__orders
    description: 1:1 перейменування колонок orders.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

  - name: stg_dim9000__order_tasks
    description: 1:1 перейменування колонок order_tasks. order_id NULL = задача співробітника.
    columns:
      - name: task_id
        tests:
          - not_null
          - unique

  - name: stg_dim9000__task_locations
    description: 1:1 перейменування колонок tasks_locations. Гео задачі, зокрема задачі співробітника без заявки.
    columns:
      - name: task_id
        tests:
          - not_null
          - unique

  - name: stg_dim9000__order_status_transitions
    description: Тільки type='transition' рядки history_order_updates — надійні before/after.status.
    columns:
      - name: history_id
        tests:
          - not_null
          - unique

  - name: stg_dim9000__statistic_citizen
    description: 1:1 перейменування колонок statistic_citizen.
    columns:
      - name: stat_id
        tests:
          - not_null
          - unique

  - name: stg_dim9000__users
    description: Тільки operational-релевантні поля users (без PII).
    columns:
      - name: user_id
        tests:
          - not_null
          - unique

  - name: stg_dim9000__space_user
    description: Зв'язка user_id × space_id, без ролі/дати.

  - name: stg_dim9000__tags
    description: >
      Довідник тегів із dim9000_fast_eu. Три незалежні простори в `tag_type`
      (task / debtor / user) — операційний дашборд бере лише `task`.
    columns:
      - name: tag_id
        tests:
          - not_null
          - unique
      - name: tag_ua
        description: >
          Назва тега. Не може містити «|»: mart_monthly_tags склеює набір
          тегів заявки в один рядок саме цим символом, а дашборд розбирає
          його назад. Тег із «|» в назві розвалив би набір на дашборді
          мовчки — тому тест стоїть тут, на джерелі, а не там.
        tests:
          - dbt_utils.expression_is_true:
              expression: "not like '%|%'"

  - name: stg_dim9000__task_tags
    description: >
      Зв'язка тег × ЗАДАЧА. До заявки тег доходить через
      order_tasks.order_id — це робить int_order_tags. Сурогатного ключа в
      джерелі немає, ключ — пара (tag_id, task_id).
    columns:
      - name: tag_id
        tests: [not_null]
      - name: task_id
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tag_id, task_id]
