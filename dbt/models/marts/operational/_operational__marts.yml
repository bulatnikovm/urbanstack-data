version: 2

models:
  - name: mart_monthly_sla
    description: >
      Grain — complex_id × report_month. created_count перевірено проти xlsx
      (Δ 2-6% на 6 з 7 місяців жовт.25-квіт.26, лют.26 — виняток +16.5%,
      потребує окремого розбору).

      Створення рахується по created_at, закриття (виконано/скасовано) — по
      closed_at, тому "виконано" за місяць МОЖЕ перевищувати "створено":
      закривали накопичене. Для питання "скільки встигаємо по гарячому" є
      sla_rate_same_month, який за побудовою не більший за 1.
    columns:
      - name: complex_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_complex')
                field: complex_id
      - name: report_month
        tests: [not_null]
      - name: created_count
        tests: [not_null]
      - name: sla_rate_same_month
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
      - name: cancel_rate_same_month
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [complex_id, report_month]

  - name: mart_complex_load_monthly
    description: >
      Grain — complex_id × report_month. Навантаження на ЖК: типи звернень,
      скарги, черга 30+, внутрішні задачі. Знаменник (n_spaces) — приміщення
      ЖК point-in-time, а не поточний стан: у Looker він був статичний, через
      що ЖК, які пішли з УК, лишались у знаменнику назавжди.
    columns:
      - name: complex_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_complex')
                field: complex_id
      - name: report_month
        tests: [not_null]
      - name: complaint_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [complex_id, report_month]

  - name: mart_orders_house_monthly
    description: >
      Grain — complex_id × house_id × property_kind_ua × category_ua ×
      type_ua × report_month. Найдетальніший зріз заявок на дашборді:
      шукач аномалій, відхилені по типу об'єкта, антирейтинг будинків.
      Глибше за будинок свідомо не йдемо (приміщення = ~164 тис. комбінацій
      і рішення все одно приймаються по будинку).
    columns:
      - name: house_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_house')
                field: house_id
      - name: created_count
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [house_id, property_kind_ua, category_ua, type_ua, report_month]

  - name: mart_status_donut
    description: Grain — complex_id × report_month × status.

  - name: mart_campaigns
    description: >
      Grain — campaign_id. Реєстр скоординованих звернень мешканців
      (детектор — int_order_campaigns). Робочий артефакт: керівник ЖК
      отримує дату, тему, будинки, кількість учасників і зразок тексту.
      Історично кампанії передували виходу будинків (Севен бер.2024 —
      22 людини, обидва будинки пішли; Варш. Плюс лист.2024 — 13 людей,
      обидва пішли).
    columns:
      - name: campaign_id
        tests:
          - not_null
          - unique
      - name: n_people
        description: Різних мешканців у кампанії. За побудовою >= 3.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 3
              inclusive: true

  - name: mart_house_churn_risk_monthly
    description: >
      Grain — house_id × report_month. Сходинки ризику 0-5 замість єдиного
      скора: подій виходу лише 13 за три роки, тому це пріоритизатор черги
      роботи, а НЕ оцінка ймовірності. Пороги підібрані на історії й не
      відкаліброані статистично — міняти їх тут нормально.

      ⚠️ CSAT-опитування не входять: 3 750 із 3 794 відповідей без house_id
      (голосування створюється одне на весь ЖК). Джерело оцінок — order_reviews.
    columns:
      - name: house_id
        tests:
          - not_null
      - name: risk_stage
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5]
              quote: false
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - house_id
            - report_month

  - name: mart_yearly_totals
    description: >
      Grain — complex_id × report_year. Компанійський тотал — сума по ЖК.
      2023-2025 збігаються з xlsx в межах 1%. 2022 розходиться — той самий
      відомий розрив, що і в PDF (різний старт колл-центру/додатку).
      in_progress_count = не закрито в межах ТОГО САМОГО року, а не поточна
      черга (поточну дає mart_monthly_sla.backlog_end_of_month).
    columns:
      - name: complex_id
        tests: [not_null]
      - name: report_year
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [complex_id, report_year]

  - name: mart_monthly_complex_overview
    description: >
      Grain — complex_id × report_month. n_houses_active = 110 на квіт.2026,
      ТОЧНИЙ збіг з xlsx (аудит-знахідка #1 закрита — паркінгові будівлі без
      квартир виключені через dim_house.is_residential).

      ⚠️ 2026-08-04: кількість мешканців (n_users_*/n_owners/n_tenants) тепер
      рахується З НУЛЯ через fct_users_monthly, а не береться з
      statistic_citizen. Снапшот джерела лишився поруч з суфіксом `_src` для
      звірки — НЕ використовувати як основний. Різниця на лип.2026:
      26 895 проти 32 396.
    columns:
      - name: complex_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_complex')
                field: complex_id

  - name: fct_users_monthly
    description: >
      Grain — complex_id × report_month. Мешканці, пораховані з `users` +
      прив'язок до приміщень через спільний int_user_exclusions, замість
      непрозорого агрегату statistic_citizen. Користувач рахується один раз,
      тому суму по ЖК можна брати як тотал.
    columns:
      - name: complex_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_complex')
                field: complex_id
      - name: report_month
        tests: [not_null]
      - name: n_users_total
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_month, complex_id]

  - name: mart_monthly_categories
    description: >
      Grain — complex_id × report_month × category_ua × type_ua. Ті самі
      лічильники й та сама методика дат, що в mart_monthly_sla, тому суми по
      всіх категоріях і типах сходяться з ним рядок-у-рядок.
    columns:
      - name: complex_id
        tests: [not_null]
      - name: created_count
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [complex_id, report_month, category_ua, type_ua]

  - name: mart_house_rating
    description: >
      Grain — house_id, поточний знімок (не історичний ряд). Знаменник —
      n_apartments, НЕ "особові рахунки" (нерозгадана метрика з аудиту).
    columns:
      - name: house_id
        tests:
          - not_null
          - unique

  - name: fct_resident_friction_monthly
    description: >
      Рівень ЛЮДИНИ в моделі раннього попередження відтоку. Grain:
      citizen_id × report_month, вікно 3 місяці. Шкала Макса (0-100) +
      floor-правила для рідкісних вирішальних сигналів + історія замість
      «вічного тега» + behaviour_segment (що робити).
      ⚠️ Персональний рівень — для контуру C, не для загального дашборду.
    columns:
      - name: citizen_id
        tests:
          - not_null
      - name: report_month
        tests:
          - not_null
      - name: tension_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: segment_no
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
              quote: false
      - name: behaviour_segment
        tests:
          - not_null
          - accepted_values:
              values: [Організатор, Хронічний, Розчарований, Мовчун, Звичайний]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [citizen_id, report_month]

  - name: mart_house_segment_mix_monthly
    description: >
      Друга вісь ризику будинку — склад населення (сегменти мешканців),
      поруч зі сходинкою конфлікту і прапорцем згасання. Grain: house_id ×
      report_month з 2024-01. Знаменник — активні мешканці, пороги —
      перцентилі всередині портфеля (з квартирами та абсолютними відсотками
      пороги Макса недосяжні: максимум по портфелю 4,8%).
    columns:
      - name: house_id
        tests:
          - not_null
      - name: report_month
        tests:
          - not_null
      - name: house_mood
        tests:
          - not_null
          - accepted_values:
              values: ['Спокійний', 'Шумний', 'Напружений', 'Ризиковий', 'мало даних']
      - name: needs_attention
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [house_id, report_month]

  - name: mart_monthly_tags
    description: >
      Grain — complex_id × report_month × category_ua × type_ua × tag_set.
      Дзеркало mart_monthly_categories з додатковим виміром — НАБОРОМ тегів
      CRM на заявці («Забудовник|заплановано 30+»), а не окремим тегом.
      Тег багатозначний, і рядок-на-тег завищував будь-який зріз та ламав
      виключення (ANA-10): заявка з двома мітками лишалась у цифрі «крім X»
      через свою другу мітку. З набором кожна заявка тут РІВНО ОДИН раз,
      тож сума по зрізу порівнянна із загальною цифрою.
    columns:
      - name: complex_id
        tests:
          - not_null
      - name: report_month
        tests:
          - not_null
      - name: tag_set
        description: >
          Теги заявки, склеєні через «|» у порядку сортування. Заявка без
          міток — «Без тега». Розбирає назад дашборд.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [complex_id, report_month, category_ua, type_ua, tag_set]
