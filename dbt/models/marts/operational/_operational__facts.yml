version: 2

models:
  - name: fact_orders
    description: >
      Grain — order_id. is_valid відсіює скасовані/відхилені, єдине визначення.
      closed_at — дата закриття (виконано або скасовано) з fallback на
      updated_at: у 2022-2023 completed_at порожній у 17-20% закритих заявок,
      і без fallback ряд "виконано" за ті роки провалюється на п'ятину.
      Прапорець is_close_date_estimated показує, де дата приблизна.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: property_kind_ua
        description: Тип об'єкта заявки (Квартира/Паркінг/Комерційне/Комора/Невідомо).
        tests:
          - not_null
      - name: is_child
        description: >
          Дочірня заявка групової (parent_id IS NOT NULL). Марти заявок її НЕ
          рахують — групова заявка представлена батьком (рішення Максима
          2026-08-26). 10 061 рядок зі 164 885.
        tests:
          - not_null
      - name: is_group_parent
        description: >
          Батьківська заявка групової — представник групи в усіх підрахунках.
          1 226 рядків. Гео успадковане від дітей: у самого батька
          space_id IS NULL завжди.
        tests:
          - not_null
      - name: n_child_houses
        description: >
          Скільки будинків охопила групова заявка. Для 842 з 1 226 батьків це
          1, тобто «домінантний будинок» = точна адреса; більші значення
          показують, де адреса є наближенням.
        tests:
          - not_null
      - name: tags
        description: >
          Теги CRM зі сторінки «Заявки» (порожній масив, якщо тегів немає).
          Джерело — dim9000_fast, а не Stitch-репліка; ланцюжок
          tags → task_tags_links → order_tasks → orders (див. int_order_tags).

  - name: fact_order_events
    description: Grain — подія (created/completed/canceled/... transition). Заявка може мати кілька подій одного типу.
    columns:
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
              config:
                severity: warn   # transition-подія могла лишитись від заявки, видаленої з orders (рідкісний край)

  - name: fact_order_tasks
    description: >
      Grain — task_id. is_employee_task = order_id IS NULL.
      Гео береться з tasks_locations (1:1 по task_id), і лише потім
      добирається через order_id→orders.space_id. До 2026-08-19 був тільки
      другий шлях, тому всі 55,7 тис. задач співробітників лишались без
      complex_id — метрику "внутрішні задачі на ЖК" порахувати було нічим.
    columns:
      - name: task_id
        tests:
          - not_null
          - unique

  - name: fact_citizen_snapshot
    description: Grain — complex_id × report_month.
    columns:
      - name: stat_id
        tests:
          - not_null
          - unique

  - name: fact_user_space
    description: >
      Grain — user_id × space_id, тільки ROLE_CITIZEN/ROLE_INACTIVATED_CITIZEN.
      Аудиторія приміщень = власники (spaces.owner_id) + співмешканці
      (space_user). Тонка вибірка над спільним int_user_space_links — окремої
      логіки прив'язки не містить.
      ⚠️ Виправлено 2026-08-04: раніше читала лише space_user і не бачила
      власників (для буд. Змієнка 15/23 давало 76 людей замість 425).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, space_id]
