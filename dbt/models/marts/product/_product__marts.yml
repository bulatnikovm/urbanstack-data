version: 2

models:
  - name: dim_app_module
    description: Модулі застосунку (seed + агрегат по каталогу подій).
    columns:
      - name: module_code
        tests: [not_null, unique]

  - name: fct_user_monthly
    description: >
      Бекбон домену. Грануляція: user_phone_sk × event_month. Живить Стр.1
      (сегменти), Стр.2 (активація), Стр.3 (актив/версії), Стр.5.
    columns:
      - name: user_phone_sk
        tests: [not_null]
      - name: event_month
        tests: [not_null]
      - name: lifecycle_segment_current
        tests:
          - accepted_values:
              arguments:
                values:
                  - '1. Активні (< 1 міс)'
                  - '2. Сплячі (1-3 міс)'
                  - '3. Ризик відтоку (3-6 міс)'
                  - '4. Загублені (6-12 міс)'
                  - '5. Мертві душі (> 1 року)'
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_phone_sk, event_month]

  - name: mart_user_base_monthly
    description: >
      Стр.1 у розрізі ЖК. Грануляція: report_month × complex_id.
      ⚠️ Сумувати по ЖК для тоталу НЕ можна (юзер може мати приміщення в
      кількох ЖК — 1 660 таких) — для тоталів є mart_user_base_totals_monthly.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_month, complex_id]

  - name: mart_user_base_totals_monthly
    description: >
      Стр.1 по всій компанії, DISTINCT-користувачі. Скоркарти й часові ряди.
      Поле visitors_devices — стара метрика по установках, лишена для
      порівняння; devices_inflation_rate показує масштаб завищення.
    columns:
      - name: report_month
        tests: [not_null, unique]

  - name: mart_activation_monthly
    description: >
      Стр.2 — воронка активації по когортах. Звірено з PDF: конверсія
      черв.2026 26,9%, трав. 18,5%, лип. 23,9% — збіг з дашбордом.
    columns:
      - name: report_month
        tests: [not_null, unique]

  - name: mart_time_to_value
    description: >
      Стр.2 — медіанний час до цінної дії. ⚠️ Виправлено баг оригіналу
      (суміжні рядкові літерали без ком → BigQuery конкатенував їх в один
      неіснуючий event_type). Цінна дія = усі термінальні успішні дії.
      Рядок report_month_key='ALL' — тотал по всіх когортах.

  - name: mart_engagement_monthly
    description: >
      Стр.3 — актив/сесії/воронки. Поля app_requests_* рахуються з ПОДІЙ
      застосунку, а не з таблиці orders — це інша метрика, ніж operational
      fact_orders (звідси префікс app_).
    columns:
      - name: report_month
        tests: [not_null, unique]

  - name: mart_utility_receipts_monthly
    description: >
      Стр.3 — квитанції за комунальні послуги, оплачені через застосунок.
      ⚠️ Джерело — `stg_finance__transactions` (домен finance, крос-доменний
      ref), не Amplitude: оплата йде через сторонній платіжний шлюз.
      Формула (transaction_type='utilities', accepted/rejected, new —
      незавершені спроби) звірена з дашбордом: лип.2026 3213/250, сума
      прийнятих 3 644 232,57 — точний збіг.
    columns:
      - name: report_month
        tests: [not_null, unique]

  - name: mart_module_usage_monthly
    description: >
      Стр.3 — використання модулів. Покриття 100% подій (було 76%): додались
      модулі Сповіщення, Віджети, Об'єкти, Тимчасові доступи, Гардіан.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_month, module_code]

  - name: mart_module_retention
    description: Стр.3 (низ) — відвал по модулях, снепшот на current_date().
    columns:
      - name: module_code
        tests: [not_null, unique]

  - name: mart_user_segments
    description: Стр.3 (донат) — сегменти × версія застосунку, снепшот.

  - name: mart_user_segments_monthly
    description: Стр.1 — Живі/Сонні/Мертві по місяцях і ЖК.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_month, complex_id]

  - name: mart_app_health_weekly
    description: >
      Стр.5 — логаути + біометрія (канонічна методика з 3 метриками, включно
      з Fallback to PIN). Грануляція: тиждень × ОС × версія.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [event_week, os_type, app_version]

  - name: mart_star_monthly
    description: >
      Стр.4 — North Star Metric. ⚠️ Категорія "3. Голосування" рахується по
      vote_details_active_btn_vote_tap (термінальна дія), а не по
      vote_details_active_form__tap. Через це Стр.3 і Стр.4 тепер узгоджені —
      раніше показували 946 і 688 за той самий місяць.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_month, star_category]

  - name: mart_adoption_funnel_monthly
    description: >
      Сквозна воронка прийняття на рівні БУДИНКУ: особовий рахунок →
      реєстрація → візит → цільова дія. Згортка до ЖК звіряється з
      mart_user_base_monthly тестом assert_house_funnel_matches_complex.
    columns:
      - name: house_id
        tests: [not_null]
      - name: n_potential
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: n_never_registered
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_month, house_id]

  - name: mart_adoption_house_monthly
    description: >
      Випереджальний показник підключення: будинок × місяць провізіонінгу ×
      тип приміщення. ⚠️ ТІЛЬКИ ЛІЧИЛЬНИКИ — частку рахує дашборд із суми за
      обраний період, бо на грануляції «будинок × місяць» лише 63 клітинки з
      2 378 мають бодай 20 людей. Частку рахувати ВИКЛЮЧНО як
      n_reg_Nd / n_mature_Nd.
    columns:
      - name: house_id
        tests: [not_null]
      - name: property_kind
        tests:
          - accepted_values:
              arguments:
                values: ['apartment', 'commercial']
      - name: n_provisioned
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [provision_month, house_id, property_kind]
      # Корзини розподілу мають у сумі давати всіх провізіонованих — інакше
      # графік розподілу мовчки втратить частину людей.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "n_d0 + n_d1_7 + n_d8_30 + n_d31_90 + n_d90plus + n_never = n_provisioned"
      # Чисельник ніколи не більший за знаменник: якщо це впаде, значить
      # зрілість перестала обмежувати обидві сторони однаково.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "n_reg_7d <= n_mature_7d and n_reg_30d <= n_mature_30d and n_reg_90d <= n_mature_90d"

  - name: mart_app_errors_monthly
    description: >
      Помилки застосунку по місяцях (report_month × error_kind). Годує детектор
      аномалій і місячний тренд на сторінці «Стан додатку». Класифікація подій —
      сід `product_event_catalog.error_kind`, підписи — `product_error_catalog`.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [report_month, error_kind]
    columns:
      - name: error_kind
        description: Вид помилки з сіда. NULL означав би подію без запису в довіднику.
        tests:
          - not_null
          - relationships:
              to: ref('product_error_catalog')
              field: error_kind
      - name: affected_users
        tests:
          - not_null
      - name: affected_rate
        description: >
          Частка зачеплених від УСІХ активних місяця. Знаменник спільний для всіх
          видів помилок — саме тому види між собою порівнювані.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
      - name: events_per_affected
        description: >
          Подій на одну зачеплену людину. Разом із часткою розрізняє дві різні
          аварії: вузька група в циклі проти широкої разової шорсткості.

  - name: mart_app_errors_weekly
    description: >
      Помилки в розрізі релізу (event_week × os_type × app_version × error_kind).
      Частка рахується від активних ТІЄЇ Ж версії, інакше показник міряє розкотку,
      а не якість.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [event_week, os_type, app_version, error_kind]
    columns:
      - name: error_kind
        tests:
          - not_null
          - relationships:
              to: ref('product_error_catalog')
              field: error_kind
      - name: version_active_users
        description: >
          Активні саме цієї версії за тиждень. ⚠️ Суму по версіях НЕ можна вважати
          аудиторією тижня: людина, що оновилась усередині тижня, є в обох.
        tests:
          - not_null
      - name: affected_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true

  - name: mart_app_error_summary_monthly
    description: >
      Зведення помилок по класах (report_month × error_class, плюс рядок `any`).
      Існує тому, що `mart_app_errors_monthly` не можна згортати складанням:
      людина з двома видами помилок лежить у двох рядках.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [report_month, error_class]
    columns:
      - name: error_class
        tests:
          - not_null
          - accepted_values:
              values: ['app', 'auth', 'access', 'any']
      - name: affected_users
        tests:
          - not_null
      - name: affected_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true

  - name: mart_adoption_curve
    description: >
      Крива підключення: вісь — дні від заведення рахунку, а не календарні
      місяці. Дозволяє читати новий ЖК з першого дня й класти його поруч із
      історичною кривою портфеля в тому самому віці.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [complex_id, day_offset]
    columns:
      - name: day_offset
        description: Днів від заведення особового рахунку, 0-90.
        tests:
          - not_null
      - name: cohort_eligible
        description: >
          Скільки людей ЦЬОГО ЖК прожили щонайменше day_offset днів від
          заведення рахунку. Знаменник рухається разом із віссю — інакше
          вчора заведена людина тягнула б униз частку «за 30 днів».
        tests:
          - not_null
      - name: opened_by
        description: >
          Скільки з них відкрили застосунок не пізніше day_offset дня.
          ⚠️ Лічильник: складати по ЖК можна, частку — ні.
        tests:
          - not_null
